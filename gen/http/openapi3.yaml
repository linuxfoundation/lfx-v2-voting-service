components:
    schemas:
        BadRequestError:
            type: object
            properties:
                code:
                    type: string
                    description: HTTP status code
                    example: Sit non dolore sit.
                message:
                    type: string
                    description: Error message
                    example: Et at eos culpa voluptate quasi facere.
            description: Bad request error response
            example:
                code: Autem asperiores.
                message: Earum veniam autem architecto perferendis aut repudiandae.
            required:
                - code
                - message
        BulkResendVoteRequestBody:
            type: object
            properties:
                personalized_links:
                    type: boolean
                    description: When true, each recipient's email links to a personal HMAC-signed URL that lets them submit or update their vote response without logging in. When false or omitted, recipients receive the standard vote link.
                    default: false
                    example: false
                recipient_ids:
                    type: array
                    items:
                        type: string
                        example: Neque asperiores dolorem voluptate voluptas odit.
                    description: Vote response (ballot) IDs to resend the vote email to
                    example:
                        - cba14f40-1636-11ec-9621-0242ac130002
                        - cba14f40-1636-11ec-9621-0242ac130003
            example:
                personalized_links: false
                recipient_ids:
                    - cba14f40-1636-11ec-9621-0242ac130002
                    - cba14f40-1636-11ec-9621-0242ac130003
            required:
                - recipient_ids
        CommentResponse:
            type: object
            properties:
                comment_text:
                    type: string
                    description: The voter's free-text response
                    example: Molestiae velit voluptate inventore beatae recusandae ea.
                prompt_id:
                    type: string
                    description: The comment prompt this response answers
                    example: 73a3e161-1206-4651-b738-3d77b5c21a22
                    format: uuid
            description: A voter's free-text response to a comment prompt
            example:
                comment_text: Fuga dolore voluptas nulla.
                prompt_id: d30792bc-0e34-4e06-a7eb-d64bc5ff8ad8
            required:
                - prompt_id
                - comment_text
        CommentResponseWithUser:
            type: object
            properties:
                abstained:
                    type: boolean
                    description: Whether the voter who submitted this comment abstained from voting on the poll
                    example: false
                comment_text:
                    type: string
                    description: The comment text
                    example: Fugit ipsam.
                profile_picture:
                    type: string
                    description: URL of the voter's profile picture. Absent entirely when the poll has pseudo_anonymity enabled.
                    example: Perferendis minus.
                user_id:
                    type: string
                    description: The LFX identifier of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
                    example: Autem doloribus veritatis porro.
                user_name:
                    type: string
                    description: The name of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
                    example: Fuga aut aut cumque porro eveniet.
                vote_creation_time:
                    type: string
                    description: The time the voter submitted this comment (their vote_creation_time)
                    example: "2014-03-07T01:07:25Z"
                    format: date-time
                vote_id:
                    type: string
                    description: The vote that submitted this comment
                    example: fffd9762-3dd7-4c32-92b4-6c6c1a4436cb
                    format: uuid
            description: A voter's free-text comment response, with attribution
            example:
                abstained: false
                comment_text: Qui accusamus quibusdam.
                profile_picture: Dolor magnam est minus cumque nihil.
                user_id: Id laborum et eos neque numquam cum.
                user_name: Id labore consequatur temporibus voluptatem quisquam harum.
                vote_creation_time: "1989-01-23T18:33:40Z"
                vote_id: 2425664d-14de-423b-a235-709c0d2785bf
            required:
                - vote_id
                - comment_text
                - vote_creation_time
                - abstained
        CommentResultItem:
            type: object
            properties:
                prompt:
                    $ref: '#/components/schemas/PollCommentPrompt'
                responses:
                    type: array
                    items:
                        $ref: '#/components/schemas/CommentResponseWithUser'
                    description: The comment responses submitted for this prompt
                    example:
                        - abstained: true
                          comment_text: Soluta voluptatem et iusto est ipsum.
                          profile_picture: Suscipit nemo et sapiente provident non omnis.
                          user_id: Perspiciatis similique soluta voluptatem.
                          user_name: Quae et vitae aut nihil cum.
                          vote_creation_time: "1972-12-27T19:26:25Z"
                          vote_id: f1b9bfa3-a171-4f46-b597-d9930aaf3851
                        - abstained: true
                          comment_text: Soluta voluptatem et iusto est ipsum.
                          profile_picture: Suscipit nemo et sapiente provident non omnis.
                          user_id: Perspiciatis similique soluta voluptatem.
                          user_name: Quae et vitae aut nihil cum.
                          vote_creation_time: "1972-12-27T19:26:25Z"
                          vote_id: f1b9bfa3-a171-4f46-b597-d9930aaf3851
            description: Results for a single comment prompt, grouped with every response to it. Every comment prompt on the poll is included, even one with zero responses.
            example:
                prompt:
                    prompt: Please provide any additional feedback
                    prompt_id: a5b956c7-999a-45e3-b365-94029af40d09
                responses:
                    - abstained: true
                      comment_text: Soluta voluptatem et iusto est ipsum.
                      profile_picture: Suscipit nemo et sapiente provident non omnis.
                      user_id: Perspiciatis similique soluta voluptatem.
                      user_name: Quae et vitae aut nihil cum.
