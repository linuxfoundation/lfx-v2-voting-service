                    example: Ducimus veniam.
                user_id:
                    type: string
                    description: The LFX identifier of the voter who submitted this comment
                    example: Est quas at eligendi voluptatem in.
                user_name:
                    type: string
                    description: The name of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
                    example: Laudantium perferendis.
                vote_creation_time:
                    type: string
                    description: The time the voter submitted this comment (their vote_creation_time)
                    example: "2015-11-22T23:11:52Z"
                    format: date-time
                vote_id:
                    type: string
                    description: The vote that submitted this comment
                    example: 3db3c680-9c78-4ed5-9590-3022613bdab8
                    format: uuid
            description: A voter's free-text comment response, with attribution
            example:
                abstained: true
                comment_text: Totam fugiat.
                user_id: Minima nihil quia et perspiciatis alias.
                user_name: Error id quia vero.
                vote_creation_time: "2008-12-14T22:58:18Z"
                vote_id: 6890c9b6-6730-4901-9bee-3f5b73759923
