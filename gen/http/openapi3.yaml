components:
    schemas:
        BadRequestError:
            type: object
            properties:
                code:
                    type: string
                    description: HTTP status code
                    example: Sequi alias est quam itaque.
                message:
                    type: string
                    description: Error message
                    example: Ut aliquam harum qui natus error odit.
            description: Bad request error response
            example:
                code: Est deserunt ea ipsum aut et iste.
                message: Explicabo quisquam consectetur molestias pariatur.
            required:
                - code
                - message
        BulkResendVoteRequestBody:
            type: object
            properties:
                recipient_ids:
                    type: array
                    items:
                        type: string
                        example: Omnis consequuntur veniam illum minima rerum.
                    description: List of recipient IDs to resend vote email to
                    example:
                        - cba14f40-1636-11ec-9621-0242ac130002
                        - cba14f40-1636-11ec-9621-0242ac130003
            example:
                recipient_ids:
                    - cba14f40-1636-11ec-9621-0242ac130002
                    - cba14f40-1636-11ec-9621-0242ac130003
            required:
                - recipient_ids
        CommentResultItem:
            type: object
            properties:
                comments:
                    type: array
                    items:
                        type: string
                        example: Suscipit ut est deserunt a.
                    description: List of comments
                    example:
                        - Molestias impedit et aliquam nesciunt consectetur totam.
                        - Quibusdam inventore.
                        - Explicabo magnam et libero autem mollitia nemo.
                prompt:
                    type: string
                    description: Comment prompt
                    example: Nulla voluptate occaecati dolorem delectus.
            description: Comment results
            example:
                comments:
                    - Et sapiente iste.
                    - Fuga iusto dolor architecto et.
                    - Quo expedita quisquam et qui nostrum suscipit.
                prompt: Sit esse.
            required:
                - prompt
                - comments
        ConflictError:
            type: object
            properties:
                code:
                    type: string
                    description: HTTP status code
                    example: Iure accusantium assumenda non.
                message:
                    type: string
                    description: Error message
                    example: Inventore quis similique dignissimos voluptas sed quia.
            description: Conflict error response
            example:
                code: Unde inventore eius ab quas consectetur.
                message: Voluptas sit.
            required:
                - code
                - message
        CreateVoteRequestBody:
            type: object
            properties:
                allow_abstain:
                    type: boolean
                    description: Allow voters to abstain
                    default: false
                    example: true
                committee_filters:
                    type: array
                    items:
                        type: string
                        example: Voting Rep
                        enum:
                            - Voting Rep
                            - Alternate Voting Rep
                            - Observer
                            - Emeritus
                    description: Committee voting status filters
                    example:
                        - Voting Rep
                        - Alternate Voting Rep
                committee_uid:
                    type: string
                    description: LFX Committee UID
                    example: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
                    format: uuid
                committee_uids:
                    type: array
                    items:
                        type: string
                        example: Autem architecto perferendis aut repudiandae quisquam.
                    description: Multiple committee UIDs
                    example:
                        - a02bdbaf-53b1-4d47-bc04-dd7e459dd308
                        - b03cdbaf-53b1-4d47-bc04-dd7e459dd309
                description:
                    type: string
                    description: Vote description
                    example: Vote for the TSC members for Q1 2026
                end_time:
                    type: string
                    description: End time in RFC3339 format
                    example: "2026-02-15T23:59:59Z"
