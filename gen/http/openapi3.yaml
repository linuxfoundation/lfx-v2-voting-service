                      user_id: Perspiciatis similique soluta voluptatem.
                      user_name: Quae et vitae aut nihil cum.
                      vote_creation_time: "1972-12-27T19:26:25Z"
                      vote_id: f1b9bfa3-a171-4f46-b597-d9930aaf3851
            required:
                - prompt
                - responses
        CondorcetMatrixEntry:
            type: object
            properties:
                choice_id:
                    type: string
                    description: Choice identifier
                    example: Voluptates quae iusto.
                choice_id_wins:
                    type: integer
                    description: Number of times choice_id wins against other_choice_id
                    example: 3487495251193943911
                    format: int64
                other_choice_id:
                    type: string
                    description: Other choice identifier
                    example: Omnis reiciendis quia quaerat.
                other_choice_id_wins:
                    type: integer
                    description: Number of times other_choice_id wins against choice_id
                    example: 8987134361933336965
                    format: int64
                result:
                    type: string
                    description: Result string (e.g., '23(10)')
                    example: Esse incidunt minus nemo quaerat non.
            description: Condorcet matrix entry for pairwise comparison
            example:
                choice_id: Inventore eligendi ut.
                choice_id_wins: 5029316612299034228
                other_choice_id: Non minima nihil quia et perspiciatis.
                other_choice_id_wins: 6894244567742773519
                result: Fugiat quis error id.
