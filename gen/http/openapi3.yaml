components:
    schemas:
        BadRequestError:
            type: object
            properties:
                code:
                    type: string
                    description: HTTP status code
                    example: Qui rerum quas.
                message:
                    type: string
                    description: Error message
                    example: Tenetur est autem.
            description: Bad request error response
            example:
                code: Tempore sunt aut sit necessitatibus perspiciatis.
                message: Fuga vel maxime voluptatem commodi veniam neque.
            required:
                - code
                - message
        BulkResendVoteRequestBody:
            type: object
            properties:
                recipient_ids:
                    type: array
                    items:
                        type: string
                        example: Consequuntur eos suscipit nulla modi.
                    description: List of recipient IDs to resend vote email to
                    example:
                        - cba14f40-1636-11ec-9621-0242ac130002
                        - cba14f40-1636-11ec-9621-0242ac130003
            example:
                recipient_ids:
                    - cba14f40-1636-11ec-9621-0242ac130002
                    - cba14f40-1636-11ec-9621-0242ac130003
            required:
                - recipient_ids
        CommentResponse:
            type: object
            properties:
                comment_text:
                    type: string
                    description: The voter's free-text response
                    example: Dolorum rem et quidem est.
                prompt_id:
                    type: string
                    description: The comment prompt this response answers
                    example: 2f670342-6070-4f9a-9105-6b9204e98f72
                    format: uuid
            description: A voter's free-text response to a comment prompt
            example:
                comment_text: Minima maiores rerum velit.
                prompt_id: 453f8110-7bf9-4e72-97ab-ab7f81d4c21a
            required:
                - prompt_id
                - comment_text
        CommentResponseWithUser:
            type: object
            properties:
                abstained:
