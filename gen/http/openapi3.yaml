components:
    schemas:
        BadRequestError:
            type: object
            properties:
                code:
                    type: string
                    description: HTTP status code
                    example: Cumque qui impedit et quaerat aut.
                message:
                    type: string
                    description: Error message
                    example: Ipsum iure eveniet et.
            description: Bad request error response
            example:
                code: Et autem magnam tenetur necessitatibus.
                message: Dolorem cumque.
            required:
                - code
                - message
        BulkResendVoteRequestBody:
            type: object
            properties:
                personalized_links:
                    type: boolean
                    description: When true, each recipient's email links to a personal HMAC-signed URL that lets them submit or update their vote response without logging in. When false or omitted, recipients receive the standard vote link.
                    default: false
                    example: true
                recipient_ids:
                    type: array
                    items:
                        type: string
                        example: Incidunt nostrum magnam ut distinctio.
                    description: Vote response (ballot) IDs to resend the vote email to
                    example:
                        - cba14f40-1636-11ec-9621-0242ac130002
                        - cba14f40-1636-11ec-9621-0242ac130003
            example:
                personalized_links: false
                recipient_ids:
                    - cba14f40-1636-11ec-9621-0242ac130002
                    - cba14f40-1636-11ec-9621-0242ac130003
            required:
                - recipient_ids
        CommentResponse:
            type: object
            properties:
                comment_text:
                    type: string
                    description: The voter's free-text response
                    example: Quam aut.
                prompt_id:
                    type: string
                    description: The comment prompt this response answers
                    example: b7f3703a-4c5c-4c02-b935-e7d2c4a9085e
                    format: uuid
            description: A voter's free-text response to a comment prompt
            example:
                comment_text: Nobis laboriosam voluptatem beatae perspiciatis.
                prompt_id: a5b31672-4777-4e87-8d86-975201bc786f
            required:
                - prompt_id
                - comment_text
        CommentResponseWithUser:
            type: object
            properties:
                abstained:
                    type: boolean
                    description: Whether the voter who submitted this comment abstained from voting on the poll
                    example: true
                comment_text:
                    type: string
                    description: The comment text
                    example: Eligendi aperiam exercitationem voluptatem fugit qui in.
                profile_picture:
                    type: string
                    description: URL of the voter's profile picture. Absent entirely when the poll has pseudo_anonymity enabled.
                    example: Alias quod.
                user_id:
                    type: string
                    description: The LFX identifier of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
                    example: Vero placeat error.
                user_name:
                    type: string
                    description: The name of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
                    example: Dolorum adipisci tempora et ullam.
                vote_creation_time:
                    type: string
                    description: The time the voter submitted this comment (their vote_creation_time)
                    example: "1995-02-08T09:16:18Z"
                    format: date-time
                vote_id:
                    type: string
                    description: The vote that submitted this comment
                    example: 800afce1-12a4-4160-bf5b-26d108f3f7be
                    format: uuid
            description: A voter's free-text comment response, with attribution
            example:
                abstained: true
                comment_text: Est voluptatem quo sit sapiente.
                profile_picture: Ut cumque dolorem eveniet.
                user_id: Illo porro adipisci.
