components:
    schemas:
        BadRequestError:
            type: object
            properties:
                code:
                    type: string
                    description: HTTP status code
                    example: Dolor voluptatum quod consequuntur.
                message:
                    type: string
                    description: Error message
                    example: Reiciendis temporibus.
            description: Bad request error response
            example:
                code: Sed unde accusamus accusamus iusto.
                message: Recusandae dignissimos.
            required:
                - code
                - message
        BulkResendVoteRequestBody:
            type: object
            properties:
                recipient_ids:
                    type: array
                    items:
                        type: string
                        example: Quos suscipit ipsum id.
                    description: List of recipient IDs to resend vote email to
                    example:
                        - cba14f40-1636-11ec-9621-0242ac130002
                        - cba14f40-1636-11ec-9621-0242ac130003
            example:
                recipient_ids:
                    - cba14f40-1636-11ec-9621-0242ac130002
                    - cba14f40-1636-11ec-9621-0242ac130003
            required:
                - recipient_ids
        CommentResultItem:
            type: object
            properties:
                comments:
                    type: array
                    items:
                        type: string
                        example: Consectetur doloribus.
                    description: List of comments
                    example:
                        - Dolorum culpa ipsam dolores.
                        - Molestias dignissimos unde voluptas.
                prompt:
                    type: string
                    description: Comment prompt
                    example: Temporibus numquam quas ipsam.
            description: Comment results
            example:
                comments:
                    - Tempora in.
                    - Possimus repudiandae labore.
                    - Voluptas molestiae eaque.
                prompt: Nisi iusto.
            required:
                - prompt
                - comments
        CondorcetMatrixEntry:
            type: object
            properties:
                choice_id:
                    type: string
                    description: Choice identifier
                    example: Deserunt optio facilis voluptas amet possimus nam.
                choice_id_wins:
                    type: integer
                    description: Number of times choice_id wins against other_choice_id
                    example: 1419829450774498446
                    format: int64
                other_choice_id:
                    type: string
                    description: Other choice identifier
                    example: Molestias quia numquam velit dolores accusamus quasi.
                other_choice_id_wins:
                    type: integer
                    description: Number of times other_choice_id wins against choice_id
                    example: 4094080608587975151
                    format: int64
                result:
                    type: string
                    description: Result string (e.g., '23(10)')
                    example: Qui deleniti autem ut.
            description: Condorcet matrix entry for pairwise comparison
            example:
                choice_id: Maiores repellendus ratione dolorum rem et quidem.
                choice_id_wins: 6950303829744644104
                other_choice_id: Aut ut ea adipisci quos possimus rerum.
                other_choice_id_wins: 4818379906103973159
                result: Numquam deserunt.
            required:
                - choice_id
                - other_choice_id
                - choice_id_wins
                - other_choice_id_wins
                - result
        ConflictError:
            type: object
            properties:
                code:
                    type: string
                    description: HTTP status code
                    example: Similique voluptatum hic et eius similique pariatur.
                message:
                    type: string
                    description: Error message
                    example: Neque officiis.
            description: Conflict error response
            example:
                code: Error harum ut impedit maxime aut debitis.
                message: Nihil delectus magnam unde ipsum est.
            required:
                - code
                - message
        CreateVoteRequestBody:
            type: object
            properties:
                allow_abstain:
                    type: boolean
                    description: Allow voters to abstain
                    default: false
                    example: true
                committee_filters:
                    type: array
                    items:
                        type: string
                        example: Emeritus
                        enum:
                            - Voting Rep
                            - Alternate Voting Rep
                            - Observer
                            - Emeritus
                    description: Committee voting status filters
                    example:
                        - Voting Rep
                        - Alternate Voting Rep
                committee_uid:
                    type: string
                    description: LFX Committee UID
                    example: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
                    format: uuid
                committee_uids:
                    type: array
                    items:
                        type: string
                        example: Et dolorem consequuntur sit blanditiis ullam non.
                    description: Multiple committee UIDs
                    example:
                        - a02bdbaf-53b1-4d47-bc04-dd7e459dd308
                        - b03cdbaf-53b1-4d47-bc04-dd7e459dd309
                description:
                    type: string
                    description: Vote description
                    example: Vote for the TSC members for Q1 2026
                end_time:
                    type: string
                    description: End time in RFC3339 format
                    example: "2026-02-15T23:59:59Z"
                    format: date-time
                name:
                    type: string
                    description: Vote name
                    example: Q1 2026 Technical Steering Committee Election
                    minLength: 1
                    maxLength: 255
                num_winners:
                    type: integer
                    description: Number of winners (meek_stv only)
                    default: 2
                    example: 9
                    format: int64
                    minimum: 2
                    maximum: 10
                poll_comment_prompts:
                    type: array
                    items:
                        $ref: '#/components/schemas/PollCommentPrompt'
                    description: Comment prompts for the vote
                    example:
                        - prompt: Please provide any additional feedback
                        - prompt: Please provide any additional feedback
                        - prompt: Please provide any additional feedback
                poll_questions:
                    type: array
                    items:
                        $ref: '#/components/schemas/PollQuestion'
                    description: Questions for the vote
