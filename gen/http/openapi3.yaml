components:
    schemas:
        BadRequestError:
            type: object
            properties:
                code:
                    type: string
                    description: HTTP status code
                    example: Et quia quasi ea.
                message:
                    type: string
                    description: Error message
                    example: Accusantium eveniet exercitationem.
            description: Bad request error response
            example:
                code: Id consequatur aut cum accusantium.
                message: Laboriosam voluptatem beatae perspiciatis voluptas cumque qui.
            required:
                - code
                - message
        BulkResendVoteRequestBody:
            type: object
            properties:
                personalized_links:
                    type: boolean
                    description: When true, each recipient's email links to a personal HMAC-signed URL that lets them submit or update their vote response without logging in. When false or omitted, recipients receive the standard vote link.
                    default: false
                    example: true
                recipient_ids:
                    type: array
                    items:
                        type: string
                        example: Occaecati incidunt debitis nam sequi voluptates laborum.
                    description: Vote response (ballot) IDs to resend the vote email to
                    example:
                        - cba14f40-1636-11ec-9621-0242ac130002
                        - cba14f40-1636-11ec-9621-0242ac130003
            example:
                personalized_links: false
                recipient_ids:
                    - cba14f40-1636-11ec-9621-0242ac130002
                    - cba14f40-1636-11ec-9621-0242ac130003
            required:
                - recipient_ids
        CommentResponse:
            type: object
            properties:
                comment_text:
                    type: string
                    description: The voter's free-text response
                    example: Consequatur minima repellendus autem porro deserunt.
                prompt_id:
                    type: string
                    description: The comment prompt this response answers
                    example: 246a65f7-8fcd-49a5-8ff8-2f86abd5317f
                    format: uuid
            description: A voter's free-text response to a comment prompt
            example:
                comment_text: Amet vero enim non minus culpa maiores.
                prompt_id: 83d4dfaf-762a-4033-a015-e66e531f183e
            required:
                - prompt_id
                - comment_text
        CommentResponseWithUser:
            type: object
            properties:
                abstained:
                    type: boolean
                    description: Whether the voter who submitted this comment abstained from voting on the poll. Absent for comments on an ended pseudo-anonymous poll.
                    example: false
                comment_text:
                    type: string
                    description: The comment text
                    example: Sunt id esse harum.
                profile_picture:
                    type: string
                    description: URL of the voter's profile picture. Absent entirely when the poll has pseudo_anonymity enabled.
                    example: Maiores praesentium corrupti laboriosam.
                user_id:
                    type: string
                    description: The LFX identifier of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
                    example: Eos tempore sapiente eveniet omnis.
                user_name:
                    type: string
                    description: The name of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
                    example: Quam voluptatem delectus natus autem.
                vote_creation_time:
                    type: string
                    description: The time the voter submitted this comment (their vote_creation_time). Absent for comments on an ended pseudo-anonymous poll.
                    example: "1998-11-13T11:07:33Z"
                    format: date-time
                vote_id:
                    type: string
                    description: The vote that submitted this comment. Absent for comments on an ended pseudo-anonymous poll, which carry the comment text only.
                    example: f953b057-6060-4caa-ad5f-7062e21a435f
                    format: uuid
            description: A voter's free-text comment response, with attribution
            example:
                abstained: true
                comment_text: Et et quidem rerum dolores.
                profile_picture: Saepe magni.
                user_id: Sit quod quam neque in.
                user_name: Natus qui quaerat.
                vote_creation_time: "2002-05-11T22:50:38Z"
                vote_id: fda806c5-04a3-41c6-b4d9-bcd3be97be29
            required:
                - comment_text
