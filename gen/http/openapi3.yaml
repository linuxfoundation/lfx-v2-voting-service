components:
    schemas:
        BadRequestError:
            type: object
            properties:
                code:
                    type: string
                    description: HTTP status code
                    example: Neque sit.
                message:
                    type: string
                    description: Error message
                    example: Ex est fugiat dolor sapiente nemo veniam.
            description: Bad request error response
            example:
                code: Natus aliquam ratione neque eos neque porro.
                message: Tempora deserunt libero sunt qui.
            required:
                - code
                - message
        BulkResendVoteRequestBody:
            type: object
            properties:
                personalized_links:
                    type: boolean
                    description: When true, each recipient's email links to a personal HMAC-signed URL that lets them submit or update their vote response without logging in. When false or omitted, recipients receive the standard vote link.
                    default: false
                    example: false
                recipient_ids:
                    type: array
                    items:
                        type: string
                        example: Adipisci corporis est.
                    description: Vote response (ballot) IDs to resend the vote email to
                    example:
                        - cba14f40-1636-11ec-9621-0242ac130002
                        - cba14f40-1636-11ec-9621-0242ac130003
            example:
                personalized_links: false
                recipient_ids:
                    - cba14f40-1636-11ec-9621-0242ac130002
                    - cba14f40-1636-11ec-9621-0242ac130003
            required:
                - recipient_ids
        CommentResponse:
            type: object
            properties:
                comment_text:
                    type: string
                    description: The voter's free-text response
                    example: Rerum non.
                prompt_id:
                    type: string
                    description: The comment prompt this response answers
                    example: fbf12fbd-d142-4977-a40b-e3bca743f7a8
                    format: uuid
            description: A voter's free-text response to a comment prompt
            example:
                comment_text: Officia rem pariatur illum libero quia veniam.
                prompt_id: 1e791a28-dc67-4906-a7a5-d03b4b028986
            required:
                - prompt_id
                - comment_text
        CommentResponseWithUser:
