    VoteUpdateVoteResponseRequestBody:
        title: VoteUpdateVoteResponseRequestBody
        type: object
        properties:
            abstain:
                type: boolean
                description: Whether to abstain from voting
                default: false
                example: true
            comment_responses:
                type: array
                items:
                    $ref: '#/definitions/CommentResponse'
                description: The voter's free-text responses to the poll's comment prompts. Allowed regardless of whether abstain is true — an abstaining voter skips the ballot but may still comment. Otherwise, omitting this field entirely preserves the vote's existing comments untouched; including it (even as an empty array) validates and replaces them. Each prompt_id must match one of the poll's comment prompts and must not repeat; each comment_text is required (cannot be empty after trimming) and is rejected with a 400 if longer than 5000 characters.
                example:
                    - comment_text: Because the incumbent has done great work this term.
                      prompt_id: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
            user_vote_content:
                type: array
                items:
                    $ref: '#/definitions/VoteAnswerInput'
                description: Updated vote answers
                example:
                    - choice_ids:
                        - b03cdbaf-53b1-4d47-bc04-dd7e459dd309
                      question_id: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
        example:
            abstain: false
            comment_responses:
                - comment_text: Because the incumbent has done great work this term.
                  prompt_id: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
            user_vote_content:
                - choice_ids:
                    - b03cdbaf-53b1-4d47-bc04-dd7e459dd309
                  question_id: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
        required:
            - abstain
securityDefinitions:
    jwt_header_Authorization:
        type: apiKey
        description: |-
            Heimdall JWT authorization

            **Security Scopes**:
              * `read:projects`: Read project data
              * `manage:projects`: Manage projects
              * `manage:voting`: Manage voting
        name: Authorization
        in: header
