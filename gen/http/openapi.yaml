    VoteUpdateVoteResponseByLinkRequestBody:
        title: VoteUpdateVoteResponseByLinkRequestBody
        type: object
        properties:
            abstain:
                type: boolean
                description: Whether to abstain from voting
                default: false
                example: false
            comment_responses:
                type: array
                items:
                    $ref: '#/definitions/CommentResponse'
                description: The voter's free-text responses to the poll's comment prompts. Allowed regardless of whether abstain is true — an abstaining voter skips the ballot but may still comment. Each prompt_id must match one of the poll's comment prompts and must not repeat; each comment_text is required (cannot be empty after trimming) and is rejected with a 400 if longer than 5000 characters. Omitting this field entirely preserves the vote's existing comments untouched; including it (even as an empty array) validates and replaces them.
                example:
                    - comment_text: Because the incumbent has done great work this term.
                      prompt_id: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
            user_vote_content:
                type: array
                items:
                    $ref: '#/definitions/VoteAnswerInput'
                description: Vote answers
                example:
                    - choice_ids:
                        - b03cdbaf-53b1-4d47-bc04-dd7e459dd309
                      question_id: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
            vote_token:
                type: string
                description: Signed token from the personalized vote link (the vote_token in the emailed URL's fragment). Identifies the ballot; treat it as a credential and never log it.
                example: v1.k2026a.eyJ2IjoiOGYzYzJhMWUtNGI1ZC00ZTZmLTlhN2ItMWMyZDNlNGY1YTZiIiwiciI6ImNiYTE0ZjQwLTE2MzYtMTFlYy05NjIxLTAyNDJhYzEzMDAwMiIsImlhdCI6MTc5MzIzMjAwMH0.vY-4FhdIHtowj0UaclJQCHvcT86Fqs47AV_AQMMNKrU
                minLength: 1
                maxLength: 1024
        example:
            abstain: true
            comment_responses:
                - comment_text: Because the incumbent has done great work this term.
                  prompt_id: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
            user_vote_content:
                - choice_ids:
                    - b03cdbaf-53b1-4d47-bc04-dd7e459dd309
                  question_id: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
            vote_token: v1.k2026a.eyJ2IjoiOGYzYzJhMWUtNGI1ZC00ZTZmLTlhN2ItMWMyZDNlNGY1YTZiIiwiciI6ImNiYTE0ZjQwLTE2MzYtMTFlYy05NjIxLTAyNDJhYzEzMDAwMiIsImlhdCI6MTc5MzIzMjAwMH0.vY-4FhdIHtowj0UaclJQCHvcT86Fqs47AV_AQMMNKrU
        required:
            - vote_token
            - abstain
