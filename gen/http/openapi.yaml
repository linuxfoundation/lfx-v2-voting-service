definitions:
    BadRequestError:
        title: BadRequestError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Voluptatem nihil laboriosam enim.
            message:
                type: string
                description: Error message
                example: Praesentium sit.
        description: Bad request
        example:
            code: Impedit inventore pariatur.
            message: Voluptas veniam illo aspernatur laudantium.
        required:
            - code
            - message
    CommentResponse:
        title: CommentResponse
        type: object
        properties:
            comment_text:
                type: string
                description: The voter's free-text response
                example: Alias aut corrupti autem.
            prompt_id:
                type: string
                description: The comment prompt this response answers
                example: e357ce82-f1cf-48dc-b1ba-790f08cde087
                format: uuid
        description: A voter's free-text response to a comment prompt
        example:
            comment_text: Tempora perspiciatis iusto laboriosam atque.
            prompt_id: 9700d627-ef2d-4654-ba7b-819d09d24270
        required:
            - prompt_id
            - comment_text
    CommentResponseWithUser:
        title: CommentResponseWithUser
        type: object
        properties:
            abstained:
                type: boolean
                description: Whether the voter who submitted this comment abstained from voting on the poll
                example: false
            comment_text:
                type: string
                description: The comment text
                example: Corrupti ut provident magni doloribus et.
            profile_picture:
                type: string
                description: URL of the voter's profile picture. Absent entirely when the poll has pseudo_anonymity enabled.
                example: Odio molestiae veritatis magni aut minus dolor.
            user_id:
                type: string
                description: The LFX identifier of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
