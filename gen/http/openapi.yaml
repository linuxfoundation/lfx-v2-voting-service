                - vote
            summary: get_vote_response vote
            description: |-
                Get vote response details (proxies to ITX GET /voting/vote/{vote_id})

                **Required security scopes for jwt**:
                  * `manage:projects`
                  * `manage:voting`
            operationId: vote#get_vote_response
