definitions:
    BadRequestError:
        title: BadRequestError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Deleniti ad et quia nihil sint.
            message:
                type: string
                description: Error message
                example: Sunt qui et.
        description: Bad request
        example:
            code: Voluptatem ullam.
            message: Aut facilis.
        required:
            - code
            - message
    CommentResponse:
        title: CommentResponse
        type: object
        properties:
            comment_text:
                type: string
                description: The voter's free-text response
                example: Maxime aut debitis unde nihil delectus magnam.
            prompt_id:
                type: string
                description: The comment prompt this response answers
                example: 996527e2-83f5-4185-904b-b4569b6be5f4
                format: uuid
        description: A voter's free-text response to a comment prompt
        example:
            comment_text: Est culpa est laboriosam.
            prompt_id: 2259d691-d3be-469d-b15a-927837045973
        required:
            - prompt_id
            - comment_text
    CommentResponseWithUser:
        title: CommentResponseWithUser
        type: object
        properties:
            abstained:
                type: boolean
                description: Whether the voter who submitted this comment abstained from voting on the poll
                example: false
            comment_text:
                type: string
                description: The comment text
                example: Et facere atque.
            profile_picture:
                type: string
                description: URL of the voter's profile picture. Absent entirely when the poll has pseudo_anonymity enabled.
                example: Voluptatem id et modi.
            user_id:
                type: string
                description: The LFX identifier of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
                example: Facere odit.
            user_name:
                type: string
                description: The name of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
                example: Hic alias aut corrupti.
            vote_creation_time:
                type: string
                description: The time the voter submitted this comment (their vote_creation_time)
                example: "1974-09-17T09:57:32Z"
                format: date-time
            vote_id:
                type: string
                description: The vote that submitted this comment
                example: aa6d2557-3bbb-4f1f-9f4e-be405697d568
                format: uuid
        description: A voter's free-text comment response, with attribution
        example:
            abstained: true
            comment_text: Incidunt et quos eum.
            profile_picture: Cumque minus amet quia quia voluptatibus.
            user_id: Molestias alias veniam consequuntur rerum.
            user_name: Magni est molestias.
            vote_creation_time: "1990-08-15T17:05:26Z"
            vote_id: 4b659030-b98c-4de7-92ea-b07d34ec0330
        required:
            - vote_id
            - comment_text
            - vote_creation_time
            - abstained
    CommentResultItem:
        title: CommentResultItem
        type: object
        properties:
            prompt:
                $ref: '#/definitions/PollCommentPrompt'
            responses:
                type: array
                items:
                    $ref: '#/definitions/CommentResponseWithUser'
                description: The comment responses submitted for this prompt
                example:
                    - abstained: false
                      comment_text: Et eos.
                      profile_picture: Dolore rem consequatur.
                      user_id: Ut voluptatem.
                      user_name: Est cumque voluptatem dignissimos.
                      vote_creation_time: "2010-07-08T21:07:52Z"
                      vote_id: ffa0fe44-736b-4bec-bfd8-84af39e109ca
                    - abstained: false
                      comment_text: Et eos.
                      profile_picture: Dolore rem consequatur.
                      user_id: Ut voluptatem.
                      user_name: Est cumque voluptatem dignissimos.
                      vote_creation_time: "2010-07-08T21:07:52Z"
                      vote_id: ffa0fe44-736b-4bec-bfd8-84af39e109ca
                    - abstained: false
                      comment_text: Et eos.
                      profile_picture: Dolore rem consequatur.
                      user_id: Ut voluptatem.
                      user_name: Est cumque voluptatem dignissimos.
                      vote_creation_time: "2010-07-08T21:07:52Z"
                      vote_id: ffa0fe44-736b-4bec-bfd8-84af39e109ca
                    - abstained: false
                      comment_text: Et eos.
                      profile_picture: Dolore rem consequatur.
                      user_id: Ut voluptatem.
                      user_name: Est cumque voluptatem dignissimos.
                      vote_creation_time: "2010-07-08T21:07:52Z"
                      vote_id: ffa0fe44-736b-4bec-bfd8-84af39e109ca
