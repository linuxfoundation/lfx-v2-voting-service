                description: Choice identifier
                example: eed65351-e712-47f2-9149-106260031f83
                format: uuid
            choice_text:
                type: string
                description: Choice text
                example: John Doe
        description: Answer choice
        example:
            choice_id: 228bbc4b-f8b7-4c84-b6c2-cab88c35b89e
            choice_text: John Doe
        required:
