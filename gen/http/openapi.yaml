                minLength: 1
            name:
                type: string
                description: Vote name
                example: Q1 2026 Technical Steering Committee Election
                minLength: 1
                maxLength: 200
            num_winners:
                type: integer
                description: Number of winners. Sent upstream only when explicitly provided; meek_stv creates default to 2 when omitted. Updates leave omitted counts for ITX to resolve.
                example: 9
                format: int64
                minimum: 2
                maximum: 10
            poll_comment_prompts:
                type: array
                items:
                    $ref: '#/definitions/PollCommentPromptInput'
                description: Comment prompts for the vote
                example:
                    - prompt: Please provide any additional feedback
                    - prompt: Please provide any additional feedback
                    - prompt: Please provide any additional feedback
            poll_questions:
                type: array
                items:
                    $ref: '#/definitions/PollQuestion'
                description: Questions for the vote
                example:
                    - choices:
                        - choice_id: fd1400cf-9977-440b-8465-d9ccf84dbc82
                          choice_text: John Doe
                        - choice_id: fd1400cf-9977-440b-8465-d9ccf84dbc82
                          choice_text: John Doe
                        - choice_id: fd1400cf-9977-440b-8465-d9ccf84dbc82
