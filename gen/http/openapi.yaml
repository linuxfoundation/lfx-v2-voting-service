definitions:
    BadRequestError:
        title: BadRequestError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Magni assumenda doloremque dignissimos est.
            message:
                type: string
                description: Error message
                example: Harum voluptatem.
        description: Bad request
        example:
            code: Sit dolores aut explicabo.
            message: Quis voluptas pariatur rerum dolorem qui.
        required:
            - code
            - message
    CommentResultItem:
        title: CommentResultItem
        type: object
        properties:
            comments:
                type: array
                items:
                    type: string
                    example: Minima ab possimus corporis cum harum quis.
                description: List of comments
                example:
                    - Ipsa qui.
                    - Officiis quidem inventore et harum.
            prompt:
                type: string
                description: Comment prompt
                example: Dicta odio consectetur omnis est debitis laboriosam.
        description: Comment results
        example:
            comments:
                - Molestiae sequi.
                - Debitis quasi excepturi.
                - Molestiae molestiae est nisi.
                - Eum quibusdam doloribus.
            prompt: Eaque aliquam aut.
        required:
            - prompt
            - comments
    ConflictError:
        title: ConflictError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Non qui autem ea ad et optio.
            message:
                type: string
                description: Error message
                example: Sunt ut perferendis natus repellat quia quis.
        description: Conflict
        example:
            code: Necessitatibus aut aut.
            message: Labore tempore harum aut nemo molestiae.
        required:
            - code
            - message
    ForbiddenError:
        title: ForbiddenError
        type: object
        properties:
            code:
