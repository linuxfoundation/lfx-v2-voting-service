                      choice_text: John Doe
                  prompt: Who should be elected to the TSC?
                  question_id: b479cb66-8b68-48ec-a636-9a46b745a54f
                  type: single_choice
                - choices:
                    - choice_id: c7b1c4d3-f7b3-40c8-92ca-849b332316b1
                      choice_text: John Doe
                    - choice_id: c7b1c4d3-f7b3-40c8-92ca-849b332316b1
