                description: Answer choices
                example:
                    - choice_id: 3269cd91-1b07-48dd-9587-22a0fbd1f712
                      choice_text: John Doe
                    - choice_id: 3269cd91-1b07-48dd-9587-22a0fbd1f712
                      choice_text: John Doe
                    - choice_id: 3269cd91-1b07-48dd-9587-22a0fbd1f712
