definitions:
    BadRequestError:
        title: BadRequestError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Id laboriosam sed.
            message:
                type: string
                description: Error message
                example: Quas sint dolores modi eveniet.
        description: Bad request
        example:
            code: Laboriosam sint quaerat qui.
            message: Et ut provident.
        required:
            - code
            - message
    CommentResponse:
        title: CommentResponse
        type: object
        properties:
            comment_text:
                type: string
                description: The voter's free-text response
                example: Non inventore.
            prompt_id:
                type: string
                description: The comment prompt this response answers
                example: 8af6be34-8c12-46e8-967f-c8fa333d8edb
                format: uuid
        description: A voter's free-text response to a comment prompt
        example:
            comment_text: Est aut.
            prompt_id: bf485395-715c-485a-b3ae-69eb883ce10e
        required:
            - prompt_id
            - comment_text
    CommentResponseWithUser:
        title: CommentResponseWithUser
        type: object
        properties:
            abstained:
                type: boolean
                description: Whether the voter who submitted this comment abstained from voting on the poll. Absent for comments on an ended pseudo-anonymous poll.
                example: true
            comment_text:
                type: string
                description: The comment text
                example: Illo praesentium perferendis non nisi.
            profile_picture:
                type: string
                description: URL of the voter's profile picture. Absent entirely when the poll has pseudo_anonymity enabled.
                example: Fugit voluptates consequatur.
            user_id:
                type: string
                description: The LFX identifier of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
                example: In dolorum voluptate tempora.
            user_name:
                type: string
                description: The name of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
                example: Ratione repellendus et velit suscipit dolore.
            vote_creation_time:
                type: string
                description: The time the voter submitted this comment (their vote_creation_time). Absent for comments on an ended pseudo-anonymous poll.
                example: "2010-05-08T22:37:14Z"
                format: date-time
            vote_id:
                type: string
                description: The vote that submitted this comment. Absent for comments on an ended pseudo-anonymous poll, which carry the comment text only.
                example: ade2c263-384a-4032-aef4-7eeecf729be5
                format: uuid
        description: A voter's free-text comment response, with attribution
        example:
            abstained: false
            comment_text: Unde sint deleniti reiciendis ut dignissimos tenetur.
            profile_picture: Similique voluptatum hic et eius similique pariatur.
            user_id: Ad voluptatibus debitis quis.
            user_name: Harum et.
            vote_creation_time: "1986-04-03T06:42:05Z"
            vote_id: 679228f8-f63e-4bd4-ae1f-06b6662f4dea
        required:
            - comment_text
    CommentResultItem:
        title: CommentResultItem
        type: object
        properties:
            prompt:
                $ref: '#/definitions/PollCommentPrompt'
            responses:
                type: array
                items:
                    $ref: '#/definitions/CommentResponseWithUser'
                description: The comment responses submitted for this prompt
                example:
                    - abstained: false
                      comment_text: Rerum illum nesciunt nemo.
                      profile_picture: Ut doloribus veniam ratione aspernatur eveniet quos.
                      user_id: Quam sit voluptatem vero.
                      user_name: Qui sint est amet.
                      vote_creation_time: "1983-01-12T02:10:32Z"
                      vote_id: f232ae5d-4ac5-4e81-a5ac-06b294b2d9ea
                    - abstained: false
                      comment_text: Rerum illum nesciunt nemo.
                      profile_picture: Ut doloribus veniam ratione aspernatur eveniet quos.
                      user_id: Quam sit voluptatem vero.
                      user_name: Qui sint est amet.
                      vote_creation_time: "1983-01-12T02:10:32Z"
                      vote_id: f232ae5d-4ac5-4e81-a5ac-06b294b2d9ea
                    - abstained: false
                      comment_text: Rerum illum nesciunt nemo.
                      profile_picture: Ut doloribus veniam ratione aspernatur eveniet quos.
                      user_id: Quam sit voluptatem vero.
                      user_name: Qui sint est amet.
                      vote_creation_time: "1983-01-12T02:10:32Z"
                      vote_id: f232ae5d-4ac5-4e81-a5ac-06b294b2d9ea
        description: Results for a single comment prompt, grouped with every response to it. Every comment prompt on the poll is included, even one with zero responses.
        example:
            prompt:
                prompt: Please provide any additional feedback
                prompt_id: 5b6b9014-ed45-421d-a948-648c79925e88
            responses:
                - abstained: false
                  comment_text: Rerum illum nesciunt nemo.
                  profile_picture: Ut doloribus veniam ratione aspernatur eveniet quos.
                  user_id: Quam sit voluptatem vero.
                  user_name: Qui sint est amet.
                  vote_creation_time: "1983-01-12T02:10:32Z"
                  vote_id: f232ae5d-4ac5-4e81-a5ac-06b294b2d9ea
