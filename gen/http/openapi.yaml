                - vote
            summary: end_vote vote
            description: |-
                End an active vote immediately (proxies to ITX POST /voting/poll/{poll_id}/end). Idempotent for an already-ended vote; a disabled vote returns 409.

                **Required security scopes for jwt**:
                  * `manage:projects`
                  * `manage:voting`
            operationId: vote#end_vote
            parameters:
                - name: uid
                  in: path
                  description: Vote UID
                  required: true
                  type: string
                  format: uuid
                - name: Authorization
                  in: header
