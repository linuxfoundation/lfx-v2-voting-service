swagger: "2.0"
info:
    title: LFX V2 - Voting Service
    description: Proxy service for ITX voting system
    version: "1.0"
host: localhost:8080
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /vote_responses:
        post:
            tags:
                - vote
            summary: create_vote_response vote
            description: |-
                Submit a vote response (proxies to ITX POST /voting/vote)

                **Required security scopes for jwt**:
                  * `manage:projects`
                  * `manage:voting`
            operationId: vote#create_vote_response
            parameters:
                - name: Authorization
                  in: header
                  description: JWT token
                  required: false
                  type: string
                - name: create_vote_response_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/VoteCreateVoteResponseRequestBody'
                    required:
                        - vote_response_uid
                        - vote_uid
                        - abstain
            responses:
                "204":
                    description: No Content response.
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/BadRequestError'
                        required:
                            - code
                            - message
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/ForbiddenError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/NotFoundError'
                        required:
                            - code
                            - message
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/InternalServerError'
                        required:
                            - code
                            - message
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/ServiceUnavailableError'
                        required:
                            - code
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /vote_responses/{vote_response_uid}:
        get:
            tags:
                - vote
            summary: get_vote_response vote
            description: |-
                Get vote response details (proxies to ITX GET /voting/vote/{vote_id})

                **Required security scopes for jwt**:
                  * `manage:projects`
                  * `manage:voting`
            operationId: vote#get_vote_response
            parameters:
                - name: vote_response_uid
                  in: path
                  description: Vote response identifier
                  required: true
                  type: string
                  format: uuid
                - name: Authorization
                  in: header
                  description: JWT token
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/VoteResponseResult'
                        required:
                            - vote_response_uid
                            - vote_uid
                            - project_uid
                            - vote_status
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/BadRequestError'
                        required:
                            - code
