definitions:
    BadRequestError:
        title: BadRequestError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Sunt est qui minima nihil architecto.
            message:
                type: string
                description: Error message
                example: Hic quis natus.
        description: Bad request
        example:
            code: Provident quisquam.
            message: Qui ut.
        required:
            - code
            - message
    CommentResponse:
        title: CommentResponse
        type: object
        properties:
            comment_text:
                type: string
                description: The voter's free-text response
                example: Id animi ut autem est.
            prompt_id:
                type: string
                description: The comment prompt this response answers
                example: d71d697f-fafb-45ec-867f-4c229436a8e0
                format: uuid
        description: A voter's free-text response to a comment prompt
        example:
            comment_text: Iste inventore.
            prompt_id: 519273af-2d1c-4e50-ab47-717ffd85de7f
        required:
            - prompt_id
            - comment_text
    CommentResponseWithUser:
        title: CommentResponseWithUser
        type: object
        properties:
            abstained:
                type: boolean
                description: Whether the voter who submitted this comment abstained from voting on the poll. Absent for comments on an ended pseudo-anonymous poll.
                example: true
            comment_text:
                type: string
                description: The comment text
                example: Minima placeat.
            profile_picture:
                type: string
                description: URL of the voter's profile picture. Absent entirely when the poll has pseudo_anonymity enabled.
                example: Odio illo.
            user_id:
                type: string
                description: The LFX identifier of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
                example: Minima amet in enim labore voluptatibus.
            user_name:
                type: string
                description: The name of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
                example: Ipsam recusandae commodi vitae molestiae.
            vote_creation_time:
                type: string
                description: The time the voter submitted this comment (their vote_creation_time). Absent for comments on an ended pseudo-anonymous poll.
                example: "2003-03-07T14:06:15Z"
                format: date-time
            vote_id:
                type: string
                description: The vote that submitted this comment. Absent for comments on an ended pseudo-anonymous poll, which carry the comment text only.
                example: e06d9849-ed2b-409b-aa2e-130f42acf345
                format: uuid
        description: A voter's free-text comment response, with attribution
        example:
            abstained: false
            comment_text: Impedit maxime aut debitis unde nihil delectus.
            profile_picture: Rerum nam eum quibusdam et aut.
            user_id: Enim error harum.
            user_name: Unde ipsum est minus ipsa placeat et.
            vote_creation_time: "2008-05-08T11:04:47Z"
            vote_id: a7c2b4de-5b9c-4b20-aa81-c1947f5d2549
        required:
            - comment_text
    CommentResultItem:
        title: CommentResultItem
        type: object
        properties:
            prompt:
                $ref: '#/definitions/PollCommentPrompt'
            responses:
                type: array
                items:
                    $ref: '#/definitions/CommentResponseWithUser'
                description: The comment responses submitted for this prompt
                example:
                    - abstained: false
                      comment_text: Ut doloribus veniam ratione aspernatur eveniet quos.
                      profile_picture: Perferendis nisi veniam alias ea voluptas.
                      user_id: Nesciunt nemo sequi qui sint est amet.
                      user_name: Recusandae non et aut voluptatum ducimus.
                      vote_creation_time: "1970-10-31T08:18:17Z"
                      vote_id: 24253725-5ed4-4d86-8202-5414cc643f46
                    - abstained: false
                      comment_text: Ut doloribus veniam ratione aspernatur eveniet quos.
                      profile_picture: Perferendis nisi veniam alias ea voluptas.
                      user_id: Nesciunt nemo sequi qui sint est amet.
                      user_name: Recusandae non et aut voluptatum ducimus.
                      vote_creation_time: "1970-10-31T08:18:17Z"
                      vote_id: 24253725-5ed4-4d86-8202-5414cc643f46
        description: Results for a single comment prompt, grouped with every response to it. Every comment prompt on the poll is included, even one with zero responses.
        example:
            prompt:
                prompt: Please provide any additional feedback
                prompt_id: 6cd10337-018f-4c74-aafb-55fef13263a2
            responses:
                - abstained: false
                  comment_text: Ut doloribus veniam ratione aspernatur eveniet quos.
                  profile_picture: Perferendis nisi veniam alias ea voluptas.
                  user_id: Nesciunt nemo sequi qui sint est amet.
                  user_name: Recusandae non et aut voluptatum ducimus.
                  vote_creation_time: "1970-10-31T08:18:17Z"
                  vote_id: 24253725-5ed4-4d86-8202-5414cc643f46
                - abstained: false
                  comment_text: Ut doloribus veniam ratione aspernatur eveniet quos.
                  profile_picture: Perferendis nisi veniam alias ea voluptas.
                  user_id: Nesciunt nemo sequi qui sint est amet.
                  user_name: Recusandae non et aut voluptatum ducimus.
                  vote_creation_time: "1970-10-31T08:18:17Z"
                  vote_id: 24253725-5ed4-4d86-8202-5414cc643f46
        required:
            - prompt
            - responses
    CondorcetMatrixEntry:
        title: CondorcetMatrixEntry
        type: object
        properties:
            choice_id:
                type: string
                description: Choice identifier
                example: Facere odit.
            choice_id_wins:
                type: integer
                description: Number of times choice_id wins against other_choice_id
                example: 3670196021416658912
                format: int64
            other_choice_id:
                type: string
                description: Other choice identifier
                example: Et facere atque.
            other_choice_id_wins:
                type: integer
                description: Number of times other_choice_id wins against choice_id
                example: 1665874104603188106
                format: int64
            result:
                type: string
                description: Result string (e.g., '23(10)')
                example: Aut corrupti.
        description: Condorcet matrix entry for pairwise comparison
        example:
            choice_id: Voluptatem id et modi.
            choice_id_wins: 7810272708659731515
            other_choice_id: Ea eveniet voluptas et odio.
            other_choice_id_wins: 2141942216799438258
            result: Molestias qui sit natus excepturi voluptas ut.
        required:
            - choice_id
            - other_choice_id
            - choice_id_wins
            - other_choice_id_wins
            - result
    ConflictError:
        title: ConflictError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Voluptas nihil dolorem.
            message:
                type: string
                description: Error message
                example: Illum beatae.
        description: Conflict
        example:
            code: Aut magni.
            message: Repellat a inventore vel accusantium vel.
        required:
            - code
            - message
    ForbiddenError:
        title: ForbiddenError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Vel illum.
            message:
                type: string
                description: Error message
                example: Eum incidunt rerum est rerum repudiandae doloribus.
        description: Forbidden
        example:
            code: Tenetur numquam.
            message: Et sunt voluptatem.
        required:
            - code
            - message
    GenericChoiceVote:
        title: GenericChoiceVote
        type: object
        properties:
            choice_id:
                type: string
                description: Choice identifier
                example: 9136b7a3-2a96-403c-a9ee-c7151298e521
                format: uuid
            percentage:
                type: number
                description: Percentage of votes
                example: 0.8742036285230746
                format: double
            vote_count:
                type: integer
                description: Number of votes
                example: 6223633963322623829
                format: int64
