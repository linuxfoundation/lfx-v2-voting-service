swagger: "2.0"
info:
    title: LFX V2 - Voting Service
    description: Proxy service for ITX voting system
    version: "1.0"
host: localhost:8080
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /votes:
        post:
            tags:
                - voting
            summary: create_vote voting
            description: |-
                Create a new vote (proxies to ITX POST /voting/poll)

                **Required security scopes for jwt**:
                  * `manage:projects`
                  * `manage:voting`
            operationId: voting#create_vote
            parameters:
                - name: Authorization
                  in: header
                  description: JWT token
                  required: false
                  type: string
                - name: create_vote_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/VotingCreateVoteRequestBody'
                    required:
                        - name
                        - description
                        - end_time
                        - project_id
                        - committee_id
                        - poll_questions
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/VoteResult'
                        required:
                            - poll_id
                            - name
                            - description
                            - status
                            - project_id
                            - committee_id
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/BadRequestError'
                        required:
                            - code
                            - message
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/ForbiddenError'
                        required:
                            - code
                            - message
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/definitions/ConflictError'
                        required:
                            - code
                            - message
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/InternalServerError'
                        required:
                            - code
                            - message
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/ServiceUnavailableError'
                        required:
                            - code
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
definitions:
    BadRequestError:
        title: BadRequestError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Asperiores corrupti quibusdam velit et.
            message:
                type: string
                description: Error message
                example: Ad sequi veritatis.
        description: Bad request
        example:
            code: Numquam iure est provident reprehenderit aperiam.
            message: Fugit ex deserunt.
        required:
            - code
            - message
    ConflictError:
        title: ConflictError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Corrupti sint explicabo voluptatibus totam.
            message:
                type: string
                description: Error message
                example: Aperiam sit earum officiis.
        description: Conflict
        example:
            code: Facere in voluptas provident aliquam dolore.
            message: Ipsam distinctio qui ut ut.
        required:
            - code
            - message
    ForbiddenError:
        title: ForbiddenError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Ea nesciunt illo dolor culpa nulla.
            message:
                type: string
                description: Error message
                example: Officia error.
        description: Forbidden
        example:
            code: Numquam consequatur.
            message: Dolores assumenda ullam sed quas et pariatur.
        required:
            - code
            - message
    InternalServerError:
        title: InternalServerError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Quasi error.
            message:
                type: string
                description: Error message
                example: Accusantium facere et.
        description: Internal server error
        example:
            code: Sed quo pariatur iste.
            message: Facere dolorem illum et eos.
        required:
            - code
            - message
    PollChoice:
        title: PollChoice
        type: object
