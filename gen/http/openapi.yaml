                type: string
                description: Choice identifier
                example: Dolore aut et voluptas.
            choice_id_wins:
                type: integer
                description: Number of times choice_id wins against other_choice_id
                example: 6460861529545510428
                format: int64
            other_choice_id:
                type: string
