    VoteCreateVoteResponseRequestBody:
        title: VoteCreateVoteResponseRequestBody
        type: object
        properties:
            abstain:
                type: boolean
                description: Whether to abstain from voting
                default: false
                example: false
            comment_responses:
                type: array
                items:
                    $ref: '#/definitions/CommentResponse'
                description: The voter's free-text responses to the poll's comment prompts. Optional; only meaningful if the poll has poll_comment_prompts. Allowed regardless of whether abstain is true — an abstaining voter skips the ballot but may still comment. Each prompt_id must match one of the poll's comment prompts and must not repeat; each comment_text is required (cannot be empty after trimming) and is rejected with a 400 if longer than 5000 characters.
                example:
                    - comment_text: Because the incumbent has done great work this term.
                      prompt_id: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
            user_vote_content:
                type: array
                items:
                    $ref: '#/definitions/VoteAnswerInput'
                description: Vote answers
                example:
                    - choice_ids:
                        - b03cdbaf-53b1-4d47-bc04-dd7e459dd309
                      question_id: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
            vote_response_uid:
                type: string
                description: Vote response identifier
                example: b03cdbaf-53b1-4d47-bc04-dd7e459dd309
                format: uuid
            vote_uid:
                type: string
                description: Vote/poll identifier this response belongs to
                example: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
                format: uuid
        example:
            abstain: false
            comment_responses:
                - comment_text: Because the incumbent has done great work this term.
                  prompt_id: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
            user_vote_content:
                - choice_ids:
                    - b03cdbaf-53b1-4d47-bc04-dd7e459dd309
                  question_id: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
            vote_response_uid: b03cdbaf-53b1-4d47-bc04-dd7e459dd309
            vote_uid: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
        required:
            - vote_response_uid
            - vote_uid
            - abstain
