definitions:
    BadRequestError:
        title: BadRequestError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Optio possimus dicta sit.
            message:
                type: string
                description: Error message
                example: Voluptatum quidem optio id enim voluptatibus molestias.
        description: Bad request
        example:
            code: Explicabo qui.
            message: Natus voluptatem nisi consequatur id ratione quod.
        required:
            - code
            - message
    CommentResultItem:
        title: CommentResultItem
        type: object
        properties:
            comments:
                type: array
                items:
                    type: string
                    example: Dicta magnam ullam ab reprehenderit voluptatibus.
                description: List of comments
                example:
                    - Illo omnis voluptates perspiciatis placeat repellat et.
                    - Eaque velit libero perspiciatis expedita.
                    - Similique ipsam deserunt alias quis.
                    - Aspernatur ipsum dolorum animi cum adipisci.
            prompt:
                type: string
                description: Comment prompt
                example: Magni voluptatem laudantium ut iusto sit.
        description: Comment results
        example:
            comments:
                - Repellat accusantium.
                - Magnam eos veniam.
            prompt: Cum repellendus.
        required:
            - prompt
            - comments
    CondorcetMatrixEntry:
        title: CondorcetMatrixEntry
        type: object
        properties:
            choice_id:
                type: string
                description: Choice identifier
                example: Debitis quasi excepturi.
            choice_id_wins:
                type: integer
                description: Number of times choice_id wins against other_choice_id
                example: 3448729423837832994
                format: int64
            other_choice_id:
                type: string
                description: Other choice identifier
                example: Molestiae molestiae est nisi.
            other_choice_id_wins:
                type: integer
