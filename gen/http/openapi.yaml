            security:
                - jwt_header_Authorization: []
        delete:
            tags:
                - vote
            summary: delete_vote vote
            description: |-
                Delete or cancel a vote (proxies to ITX DELETE /voting/poll/{poll_id}). A disabled (draft) vote is deleted. An active vote is cancelled: the vote and its responses are permanently removed, and recipients receive a cancellation notice; response cleanup runs asynchronously. Ended votes, whether closed early, closed automatically or past end_time, cannot be deleted; ITX returns 400 'ended polls cannot be deleted'. Requires writer on the vote.

                **Required security scopes for jwt**:
                  * `manage:projects`
                  * `manage:voting`
            operationId: vote#delete_vote
            parameters:
                - name: uid
                  in: path
                  description: Vote UID
                  required: true
                  type: string
                  format: uuid
            responses:
