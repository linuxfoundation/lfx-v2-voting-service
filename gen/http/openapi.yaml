            description: 'Submit a vote response using a personalized vote link token, without logging in (proxies to ITX POST /voting/vote). The ballot is identified only by the token. External callers send no Authorization header: the gateway (Heimdall) admits the request anonymously and supplies the JWT shown in this spec''s security requirement.'
