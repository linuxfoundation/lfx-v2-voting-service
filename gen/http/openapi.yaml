    CondorcetMatrixEntry:
        title: CondorcetMatrixEntry
        type: object
        properties:
            choice_id:
                type: string
                description: Choice identifier
                example: Explicabo amet eligendi ea dolor.
            choice_id_wins:
                type: integer
                description: Number of times choice_id wins against other_choice_id
                example: 2492235459299954923
                format: int64
            other_choice_id:
                type: string
                description: Other choice identifier
                example: Totam aut et ut temporibus neque.
            other_choice_id_wins:
                type: integer
                description: Number of times other_choice_id wins against choice_id
                example: 1622149910893604365
                format: int64
            result:
                type: string
                description: Result string (e.g., '23(10)')
                example: Sit qui suscipit earum est.
        description: Condorcet matrix entry for pairwise comparison
        example:
            choice_id: Ut et.
            choice_id_wins: 7682438908844742189
            other_choice_id: Tenetur velit quaerat quis harum quidem.
            other_choice_id_wins: 5699942583208432137
            result: Tempora perspiciatis iusto laboriosam atque.
        required:
            - choice_id
            - other_choice_id
            - choice_id_wins
            - other_choice_id_wins
            - result
    ConflictError:
        title: ConflictError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Vel reprehenderit qui et quibusdam.
            message:
                type: string
                description: Error message
                example: Eaque aspernatur a aut dolorem illum.
        description: Conflict
        example:
            code: Corrupti ut provident magni doloribus et.
            message: Eos et ut totam.
        required:
            - code
            - message
    ForbiddenError:
        title: ForbiddenError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Rerum ab facilis mollitia eum corporis.
            message:
                type: string
                description: Error message
                example: Assumenda quis libero quam non laboriosam.
        description: Forbidden
        example:
            code: Praesentium voluptate sequi quo omnis accusantium asperiores.
            message: Voluptas nihil dolorem.
        required:
            - code
            - message
