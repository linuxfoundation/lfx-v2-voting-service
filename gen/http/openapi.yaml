    VoteUpdateVoteRequestBody:
        title: VoteUpdateVoteRequestBody
        type: object
        properties:
            allow_abstain:
                type: boolean
                description: Allow voters to abstain
                default: false
                example: false
            allow_vote_change:
                type: boolean
                description: Allow voters to change a submitted ballot (choices, comments or abstention) until the vote ends. Omitted on create means allowed; omitted on update preserves the stored value.
                example: false
            committee_filters:
                type: array
                items:
                    type: string
                    example: Alternate Voting Rep
                    enum:
                        - Voting Rep
                        - Alternate Voting Rep
                        - Observer
                        - Emeritus
                description: Committee voting status filters
                example:
                    - Voting Rep
                    - Alternate Voting Rep
            committee_uid:
                type: string
                description: LFX Committee UID
                example: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
                format: uuid
            committee_uids:
                type: array
                items:
                    type: string
                    example: Est architecto.
