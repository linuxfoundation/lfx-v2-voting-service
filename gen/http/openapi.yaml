        type: object
        properties:
            choice_id:
                type: string
                description: Choice identifier
                example: Sed animi non.
            choice_id_wins:
                type: integer
                description: Number of times choice_id wins against other_choice_id
                example: 3560250683101552276
                format: int64
            other_choice_id:
                type: string
                description: Other choice identifier
                example: Repellat sunt autem.
            other_choice_id_wins:
