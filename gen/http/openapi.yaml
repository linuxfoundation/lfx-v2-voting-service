                    schema:
                        $ref: '#/definitions/NotFoundError'
                        required:
                            - code
                            - message
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/InternalServerError'
                        required:
                            - code
                            - message
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/ServiceUnavailableError'
                        required:
                            - code
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /votes/{uid}/results:
        get:
            tags:
                - vote
            summary: get_vote_results vote
            description: |-
                Get vote results (proxies to ITX GET /voting/poll/{poll_id}/results)

                **Required security scopes for jwt**:
                  * `manage:projects`
                  * `manage:voting`
            operationId: vote#get_vote_results
            parameters:
                - name: uid
                  in: path
                  description: Vote UID
                  required: true
                  type: string
                  format: uuid
                - name: Authorization
                  in: header
                  description: JWT token
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/VoteResultsResult'
                        required:
                            - poll_results
                            - num_recipients
                            - num_votes_cast
                            - num_abstained
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/BadRequestError'
                        required:
                            - code
                            - message
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/ForbiddenError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/NotFoundError'
                        required:
                            - code
                            - message
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/InternalServerError'
                        required:
                            - code
                            - message
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/ServiceUnavailableError'
                        required:
                            - code
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
definitions:
    BadRequestError:
        title: BadRequestError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Illum ut.
            message:
                type: string
                description: Error message
                example: Libero eos illo sit.
        description: Bad request
        example:
            code: Nihil qui rerum in.
            message: Perspiciatis qui.
        required:
            - code
            - message
    CommentResponse:
        title: CommentResponse
        type: object
        properties:
            comment_text:
                type: string
                description: The voter's free-text response
                example: Commodi est harum.
            prompt_id:
                type: string
                description: The comment prompt this response answers
                example: bea15373-7387-42c9-b299-69ded86a246f
                format: uuid
        description: A voter's free-text response to a comment prompt
        example:
            comment_text: Omnis voluptatem.
            prompt_id: 70cf9dd1-d83f-4dc2-a8d4-23dc655080b4
        required:
            - prompt_id
            - comment_text
    CommentResponseWithUser:
        title: CommentResponseWithUser
        type: object
        properties:
            abstained:
                type: boolean
                description: Whether the voter who submitted this comment abstained from voting on the poll
                example: true
            comment_text:
                type: string
                description: The comment text
                example: Ab repellat nisi quia nam.
            profile_picture:
                type: string
                description: URL of the voter's profile picture. Absent entirely when the poll has pseudo_anonymity enabled.
                example: Voluptatum soluta porro officiis doloremque eum.
            user_id:
                type: string
                description: The LFX identifier of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
                example: Totam recusandae culpa sit.
            user_name:
                type: string
                description: The name of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
                example: Facilis iusto assumenda quis quam iure est.
            vote_creation_time:
                type: string
                description: The time the voter submitted this comment (their vote_creation_time)
                example: "2007-03-24T13:10:12Z"
                format: date-time
            vote_id:
                type: string
                description: The vote that submitted this comment
                example: b5d92001-cf08-4986-9a51-1a453b608129
                format: uuid
        description: A voter's free-text comment response, with attribution
        example:
            abstained: true
            comment_text: Optio soluta ex officia sit est et.
            profile_picture: Porro enim.
            user_id: Facilis est alias.
            user_name: Voluptatibus incidunt officiis.
            vote_creation_time: "2008-05-08T08:11:18Z"
            vote_id: 40d50984-a5a9-41db-8bdc-3ea016cb9b28
        required:
            - vote_id
            - comment_text
            - vote_creation_time
            - abstained
