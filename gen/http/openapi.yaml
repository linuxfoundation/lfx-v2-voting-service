                example: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
                format: uuid
            committee_uids:
                type: array
                items:
                    type: string
                    example: Minima nam ratione eum.
                description: Multiple committee UIDs
                example:
                    - a02bdbaf-53b1-4d47-bc04-dd7e459dd308
                    - b03cdbaf-53b1-4d47-bc04-dd7e459dd309
            description:
                type: string
                description: Vote description
                example: Vote for the TSC members for Q1 2026
            end_time:
                type: string
                description: End time in RFC3339 format
                example: "2026-02-15T23:59:59Z"
                format: date-time
            end_time_timezone:
                type: string
                description: IANA timezone name used to interpret end_time (e.g. "America/New_York"). Required. ITX honors `end_time` exactly as sent in this timezone.
