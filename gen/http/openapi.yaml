            - responses
    CondorcetMatrixEntry:
        title: CondorcetMatrixEntry
        type: object
        properties:
            choice_id:
                type: string
                description: Choice identifier
                example: Reprehenderit a et dignissimos doloremque quia.
            choice_id_wins:
                type: integer
                description: Number of times choice_id wins against other_choice_id
                example: 3439406429721064044
                format: int64
            other_choice_id:
                type: string
                description: Other choice identifier
                example: Est laboriosam consequatur.
            other_choice_id_wins:
                type: integer
                description: Number of times other_choice_id wins against choice_id
                example: 1957669952622685459
                format: int64
            result:
                type: string
                description: Result string (e.g., '23(10)')
                example: Sit est libero.
        description: Condorcet matrix entry for pairwise comparison
        example:
            choice_id: Quod expedita dolorum et et quam corrupti.
            choice_id_wins: 4599748991138024991
            other_choice_id: Possimus magni porro facilis earum.
            other_choice_id_wins: 7669396890099356520
            result: Facere odit.
        required:
            - choice_id
            - other_choice_id
            - choice_id_wins
            - other_choice_id_wins
            - result
    ConflictError:
        title: ConflictError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Eum incidunt rerum est rerum repudiandae doloribus.
            message:
                type: string
                description: Error message
                example: Tenetur numquam.
        description: Conflict
        example:
            code: Et sunt voluptatem.
            message: Esse fugit quo eius iure dolor.
        required:
            - code
            - message
    ForbiddenError:
        title: ForbiddenError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Nihil architecto sunt hic quis.
            message:
                type: string
                description: Error message
                example: Sint provident quisquam.
        description: Forbidden
        example:
            code: Qui ut.
            message: Aut porro.
        required:
            - code
            - message
