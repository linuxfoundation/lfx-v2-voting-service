swagger: "2.0"
info:
    title: LFX V2 - Voting Service
    description: Proxy service for ITX voting system
    version: "1.0"
host: localhost:8080
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /vote_responses:
        post:
            tags:
                - vote
            summary: create_vote_response vote
            description: |-
                Submit a vote response (proxies to ITX POST /voting/vote)

                **Required security scopes for jwt**:
                  * `manage:projects`
                  * `manage:voting`
            operationId: vote#create_vote_response
            parameters:
                - name: Authorization
                  in: header
                  description: JWT token
                  required: false
                  type: string
                - name: create_vote_response_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/VoteCreateVoteResponseRequestBody'
                    required:
                        - vote_response_uid
                        - vote_uid
                        - abstain
            responses:
                "204":
                    description: No Content response.
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/BadRequestError'
                        required:
                            - code
                            - message
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "403":
                    description: Forbidden response.
