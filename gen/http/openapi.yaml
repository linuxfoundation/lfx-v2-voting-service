swagger: "2.0"
info:
    title: LFX V2 - Voting Service
    description: Proxy service for ITX voting system
    version: "1.0"
host: localhost:8080
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /votes:
        post:
            tags:
                - voting
            summary: create_vote voting
            description: |-
                Create a new vote (proxies to ITX POST /voting/poll)

                **Required security scopes for jwt**:
                  * `manage:projects`
                  * `manage:voting`
            operationId: voting#create_vote
            parameters:
                - name: Authorization
                  in: header
                  description: JWT token
                  required: false
                  type: string
                - name: create_vote_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/VotingCreateVoteRequestBody'
                    required:
                        - name
                        - description
                        - end_time
                        - project_uid
                        - committee_uid
                        - poll_questions
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/VoteResult'
                        required:
                            - vote_uid
                            - name
                            - description
                            - status
                            - project_uid
                            - committee_uid
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/BadRequestError'
                        required:
                            - code
                            - message
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/ForbiddenError'
                        required:
                            - code
                            - message
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/definitions/ConflictError'
                        required:
                            - code
                            - message
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/InternalServerError'
                        required:
                            - code
                            - message
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/ServiceUnavailableError'
                        required:
                            - code
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /votes/{vote_uid}:
        get:
            tags:
                - voting
            summary: get_vote voting
            description: |-
                Get vote details (proxies to ITX GET /voting/poll/{poll_id})

                **Required security scopes for jwt**:
                  * `manage:projects`
                  * `manage:voting`
            operationId: voting#get_vote
            parameters:
                - name: vote_uid
                  in: path
                  description: Vote UID
                  required: true
                  type: string
                  format: uuid
                - name: Authorization
                  in: header
                  description: JWT token
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/VoteResult'
                        required:
                            - vote_uid
                            - name
                            - description
                            - status
                            - project_uid
                            - committee_uid
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/BadRequestError'
                        required:
                            - code
                            - message
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/ForbiddenError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/NotFoundError'
                        required:
                            - code
                            - message
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/InternalServerError'
                        required:
                            - code
                            - message
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/ServiceUnavailableError'
                        required:
                            - code
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
        put:
            tags:
                - voting
            summary: update_vote voting
            description: |-
                Update vote (proxies to ITX PUT /voting/poll/{poll_id}). Only allowed when status is 'disabled'

                **Required security scopes for jwt**:
                  * `manage:projects`
                  * `manage:voting`
            operationId: voting#update_vote
            parameters:
                - name: vote_uid
                  in: path
                  description: Vote UID
                  required: true
                  type: string
                  format: uuid
                - name: Authorization
                  in: header
                  description: JWT token
                  required: false
                  type: string
                - name: update_vote_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/VotingUpdateVoteRequestBody'
                    required:
                        - name
                        - description
                        - end_time
                        - poll_questions
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/VoteResult'
                        required:
                            - vote_uid
                            - name
                            - description
                            - status
                            - project_uid
                            - committee_uid
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/BadRequestError'
                        required:
                            - code
                            - message
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/ForbiddenError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/NotFoundError'
                        required:
                            - code
                            - message
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/InternalServerError'
                        required:
                            - code
                            - message
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/ServiceUnavailableError'
                        required:
                            - code
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
        delete:
            tags:
                - voting
            summary: delete_vote voting
            description: |-
                Delete vote (proxies to ITX DELETE /voting/poll/{poll_id}). Only allowed when status is 'disabled'

                **Required security scopes for jwt**:
                  * `manage:projects`
                  * `manage:voting`
            operationId: voting#delete_vote
            parameters:
                - name: vote_uid
                  in: path
                  description: Vote UID
                  required: true
                  type: string
                  format: uuid
                - name: Authorization
                  in: header
                  description: JWT token
                  required: false
                  type: string
            responses:
                "204":
                    description: No Content response.
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/BadRequestError'
                        required:
                            - code
                            - message
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/ForbiddenError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/NotFoundError'
                        required:
                            - code
                            - message
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/InternalServerError'
                        required:
                            - code
                            - message
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/ServiceUnavailableError'
                        required:
                            - code
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
definitions:
    BadRequestError:
        title: BadRequestError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Rerum eaque ipsam eos.
            message:
                type: string
                description: Error message
                example: Enim aut.
        description: Bad request
        example:
            code: Fugit vel fugit aut.
            message: Voluptas et.
        required:
            - code
            - message
    ConflictError:
        title: ConflictError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Fugiat quidem aut aspernatur mollitia quis sed.
            message:
                type: string
                description: Error message
                example: Animi placeat.
        description: Conflict
        example:
            code: Dolorem cumque provident.
            message: Quia voluptatem reiciendis sit saepe earum.
        required:
            - code
            - message
    ForbiddenError:
        title: ForbiddenError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Rem hic ex quibusdam architecto excepturi.
            message:
                type: string
                description: Error message
                example: Eaque est quaerat neque quis enim rem.
        description: Forbidden
        example:
            code: Molestiae natus.
            message: Quis corrupti eius dolore est.
        required:
            - code
            - message
    InternalServerError:
        title: InternalServerError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Repellat quaerat quas debitis aut perspiciatis.
            message:
                type: string
                description: Error message
                example: Tempore dolor dolores quibusdam.
        description: Internal server error
        example:
            code: Quia suscipit accusantium natus nam accusamus est.
            message: Sed consequatur consectetur non aut.
        required:
            - code
            - message
    NotFoundError:
        title: NotFoundError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Et consequatur voluptatem vel.
            message:
                type: string
                description: Error message
                example: Perspiciatis sed ratione iusto rerum pariatur itaque.
        description: Not found
        example:
            code: Qui in voluptas quos.
            message: Qui alias totam.
        required:
            - code
            - message
    PollChoice:
        title: PollChoice
        type: object
        properties:
            choice_id:
                type: string
                description: Choice identifier
                example: 7baa4e86-5dd6-45af-bf9a-e795b3ddf9fa
                format: uuid
            choice_text:
                type: string
                description: Choice text
                example: John Doe
        description: Answer choice
        example:
            choice_id: 06811683-33a8-4ea5-b8ab-6c906cb40bbe
            choice_text: John Doe
        required:
            - choice_text
    PollCommentPrompt:
        title: PollCommentPrompt
        type: object
        properties:
            prompt:
                type: string
                description: Comment prompt text
                example: Please provide any additional feedback
        description: Comment prompt for collecting feedback
        example:
            prompt: Please provide any additional feedback
        required:
            - prompt
    PollQuestion:
        title: PollQuestion
        type: object
        properties:
            choices:
                type: array
                items:
                    $ref: '#/definitions/PollChoice'
                description: Answer choices
                example:
                    - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                      choice_text: John Doe
                    - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                      choice_text: John Doe
            prompt:
                type: string
                description: Question prompt
                example: Who should be elected to the TSC?
            question_id:
                type: string
                description: Question identifier
                example: 4654b4e4-85dd-4837-8670-947733e1b3e0
                format: uuid
            type:
                type: string
                description: Question type
                example: single_choice
                enum:
                    - single_choice
                    - multiple_choice
        description: Vote question
        example:
            choices:
                - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                  choice_text: John Doe
                - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                  choice_text: John Doe
                - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                  choice_text: John Doe
                - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                  choice_text: John Doe
            prompt: Who should be elected to the TSC?
            question_id: 86cef335-7304-47c0-a9b8-d1d70ae470d1
            type: single_choice
        required:
            - prompt
            - type
            - choices
    ServiceUnavailableError:
        title: ServiceUnavailableError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Ut iure eaque.
            message:
                type: string
                description: Error message
                example: Quo quidem iure.
        description: Service unavailable
        example:
            code: Sint necessitatibus molestias similique ut asperiores.
            message: Molestias ipsam.
        required:
            - code
            - message
    UnauthorizedError:
        title: UnauthorizedError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Laboriosam molestiae.
            message:
                type: string
                description: Error message
                example: Explicabo sunt porro fugiat.
        description: Unauthorized
        example:
            code: Laborum a tempora eaque officia.
            message: Maiores eum reiciendis beatae.
        required:
            - code
            - message
    VoteResult:
        title: VoteResult
        type: object
        properties:
            allow_abstain:
                type: boolean
                description: Allow abstain
                example: false
            committee_name:
                type: string
                description: Committee name
                example: Libero provident ratione quibusdam magni ipsa omnis.
            committee_type:
                type: string
                description: Committee type
                example: Mollitia labore.
            committee_uid:
                type: string
                description: Committee UID
                example: Non itaque velit.
            committee_voting_status:
                type: boolean
                description: Committee voting status
                example: false
            creation_time:
                type: string
                description: Creation time
                example: "1979-04-20T15:08:44Z"
                format: date-time
            description:
                type: string
                description: Vote description
                example: Aspernatur et hic rerum non expedita ea.
            end_time:
                type: string
                description: End time
                example: "1996-06-26T06:24:14Z"
                format: date-time
            last_modified_time:
                type: string
                description: Last modified time
                example: "2012-06-11T12:08:01Z"
                format: date-time
            name:
                type: string
                description: Vote name
                example: Provident voluptatem quis provident nulla quia.
            num_response_received:
                type: integer
                description: Responses received
                example: 35568202025658232
                format: int64
            poll_questions:
                type: array
                items:
                    $ref: '#/definitions/PollQuestion'
                description: Vote questions
                example:
                    - choices:
                        - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                          choice_text: John Doe
                        - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                          choice_text: John Doe
                      prompt: Who should be elected to the TSC?
                      question_id: 510c35f0-145b-4eed-818b-486dc2b80f16
                      type: single_choice
                    - choices:
                        - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                          choice_text: John Doe
                        - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                          choice_text: John Doe
                      prompt: Who should be elected to the TSC?
                      question_id: 510c35f0-145b-4eed-818b-486dc2b80f16
                      type: single_choice
                    - choices:
                        - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                          choice_text: John Doe
                        - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                          choice_text: John Doe
                      prompt: Who should be elected to the TSC?
                      question_id: 510c35f0-145b-4eed-818b-486dc2b80f16
                      type: single_choice
                    - choices:
                        - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                          choice_text: John Doe
                        - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                          choice_text: John Doe
                      prompt: Who should be elected to the TSC?
                      question_id: 510c35f0-145b-4eed-818b-486dc2b80f16
                      type: single_choice
            project_uid:
                type: string
                description: Project UID
                example: Et dicta ut eveniet.
            pseudo_anonymity:
                type: boolean
                description: Pseudo-anonymity enabled
                example: false
            status:
                type: string
                description: Vote status
                example: disabled
                enum:
                    - disabled
                    - active
                    - ended
            total_voting_request_invitations:
                type: integer
                description: Total invitations sent
                example: 3900342179432466240
                format: int64
            vote_uid:
                type: string
                description: Vote identifier
                example: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
                format: uuid
        example:
            allow_abstain: false
            committee_name: Assumenda accusamus nihil iste dolore ut.
            committee_type: Molestiae ut.
            committee_uid: Ut voluptatem ipsum.
            committee_voting_status: true
            creation_time: "1978-10-01T17:57:04Z"
            description: Accusamus odit aut ratione.
            end_time: "1976-06-19T01:45:18Z"
            last_modified_time: "1974-07-08T19:36:53Z"
            name: Dolor nisi aut distinctio.
            num_response_received: 1603899179203311529
            poll_questions:
                - choices:
                    - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                      choice_text: John Doe
                    - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                      choice_text: John Doe
                  prompt: Who should be elected to the TSC?
                  question_id: 510c35f0-145b-4eed-818b-486dc2b80f16
                  type: single_choice
                - choices:
                    - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                      choice_text: John Doe
                    - choice_id: 82eb444d-60fa-4cef-b7bc-a1a754bce298
                      choice_text: John Doe
                  prompt: Who should be elected to the TSC?
                  question_id: 510c35f0-145b-4eed-818b-486dc2b80f16
                  type: single_choice
            project_uid: Sed numquam aut totam.
            pseudo_anonymity: true
            status: disabled
            total_voting_request_invitations: 2056769997941245897
            vote_uid: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
        required:
            - vote_uid
            - name
            - description
            - status
            - project_uid
            - committee_uid
    VotingCreateVoteRequestBody:
        title: VotingCreateVoteRequestBody
        type: object
        properties:
            allow_abstain:
                type: boolean
                description: Allow voters to abstain
                default: false
                example: true
            committee_filters:
                type: array
                items:
                    type: string
                    example: Alternate Voting Rep
                    enum:
                        - Voting Rep
                        - Alternate Voting Rep
                        - Observer
                        - Emeritus
                description: Committee voting status filters
                example:
                    - Voting Rep
                    - Alternate Voting Rep
            committee_uid:
                type: string
                description: LFX Committee UID
                example: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
                format: uuid
            committee_uids:
                type: array
                items:
                    type: string
                    example: Cum est provident vel quia quod quidem.
                description: Multiple committee UIDs
                example:
                    - a02bdbaf-53b1-4d47-bc04-dd7e459dd308
                    - b03cdbaf-53b1-4d47-bc04-dd7e459dd309
            description:
                type: string
                description: Vote description
                example: Vote for the TSC members for Q1 2026
            end_time:
                type: string
                description: End time in RFC3339 format
                example: "2026-02-15T23:59:59Z"
                format: date-time
            name:
                type: string
                description: Vote name
                example: Q1 2026 Technical Steering Committee Election
                minLength: 1
                maxLength: 255
            num_winners:
                type: integer
                description: Number of winners (meek_stv only)
                default: 2
                example: 7
                format: int64
                minimum: 2
                maximum: 10
            poll_comment_prompts:
                type: array
                items:
                    $ref: '#/definitions/PollCommentPrompt'
                description: Comment prompts for the vote
                example:
                    - prompt: Please provide any additional feedback
                    - prompt: Please provide any additional feedback
                    - prompt: Please provide any additional feedback
            poll_questions:
                type: array
                items:
                    $ref: '#/definitions/PollQuestion'
                description: Questions for the vote
                example:
                    - choices:
                        - choice_id: f4bc3849-65e4-4b3a-aad4-35ca6b2faff0
                          choice_text: John Doe
                        - choice_id: f4bc3849-65e4-4b3a-aad4-35ca6b2faff0
                          choice_text: John Doe
                        - choice_id: f4bc3849-65e4-4b3a-aad4-35ca6b2faff0
                          choice_text: John Doe
                        - choice_id: f4bc3849-65e4-4b3a-aad4-35ca6b2faff0
                          choice_text: John Doe
                      prompt: Who should be elected to the TSC?
                      question_id: 71afec48-fb7f-4c4d-a85a-ceca6100727f
                      type: single_choice
                    - choices:
                        - choice_id: f4bc3849-65e4-4b3a-aad4-35ca6b2faff0
                          choice_text: John Doe
                        - choice_id: f4bc3849-65e4-4b3a-aad4-35ca6b2faff0
                          choice_text: John Doe
                        - choice_id: f4bc3849-65e4-4b3a-aad4-35ca6b2faff0
                          choice_text: John Doe
                        - choice_id: f4bc3849-65e4-4b3a-aad4-35ca6b2faff0
                          choice_text: John Doe
                      prompt: Who should be elected to the TSC?
                      question_id: 71afec48-fb7f-4c4d-a85a-ceca6100727f
                      type: single_choice
            poll_type:
                type: string
                description: Type of poll
                default: generic
                example: condorcet_irv
                enum:
                    - generic
                    - condorcet_irv
                    - meek_stv
            project_uid:
                type: string
                description: LFX Project UID
                example: a09P000000DsCBuIRT
            pseudo_anonymity:
                type: boolean
                description: Enable pseudo-anonymity
                default: false
                example: false
            quorum_percentage:
                type: integer
                description: Quorum percentage required
                example: 50
                format: int64
                minimum: 0
                maximum: 100
            winning_threshold_percentage:
                type: integer
                description: Winning threshold percentage
                example: 51
                format: int64
                minimum: 0
                maximum: 100
        example:
            allow_abstain: false
            committee_filters:
                - Voting Rep
                - Alternate Voting Rep
            committee_uid: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
            committee_uids:
                - a02bdbaf-53b1-4d47-bc04-dd7e459dd308
                - b03cdbaf-53b1-4d47-bc04-dd7e459dd309
            description: Vote for the TSC members for Q1 2026
            end_time: "2026-02-15T23:59:59Z"
            name: Q1 2026 Technical Steering Committee Election
            num_winners: 5
            poll_comment_prompts:
                - prompt: Please provide any additional feedback
                - prompt: Please provide any additional feedback
            poll_questions:
                - choices:
                    - choice_id: f4bc3849-65e4-4b3a-aad4-35ca6b2faff0
                      choice_text: John Doe
                    - choice_id: f4bc3849-65e4-4b3a-aad4-35ca6b2faff0
                      choice_text: John Doe
                    - choice_id: f4bc3849-65e4-4b3a-aad4-35ca6b2faff0
                      choice_text: John Doe
                    - choice_id: f4bc3849-65e4-4b3a-aad4-35ca6b2faff0
