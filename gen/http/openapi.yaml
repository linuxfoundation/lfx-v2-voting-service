definitions:
    BadRequestError:
        title: BadRequestError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Omnis quia rerum inventore minus expedita suscipit.
            message:
                type: string
                description: Error message
                example: In occaecati quisquam omnis perspiciatis porro.
        description: Bad request error response
        example:
            code: Omnis quia rerum inventore minus expedita suscipit.
            message: In occaecati quisquam omnis perspiciatis porro.
        required:
            - code
            - message
    CommentResponse:
        title: CommentResponse
        type: object
        properties:
            comment_text:
                type: string
                description: The voter's free-text response
                example: Quo autem error sunt qui omnis autem.
            prompt_id:
                type: string
                description: The comment prompt this response answers
                example: cee4c7ef-6138-45a8-be13-4336f7d464b4
                format: uuid
        description: A voter's free-text response to a comment prompt
        example:
            comment_text: Quo autem error sunt qui omnis autem.
            prompt_id: cee4c7ef-6138-45a8-be13-4336f7d464b4
        required:
            - prompt_id
            - comment_text
    CommentResponseWithUser:
        title: CommentResponseWithUser
        type: object
        properties:
            abstained:
                type: boolean
                description: Whether the voter who submitted this comment abstained from voting on the poll. Absent for comments on an ended pseudo-anonymous poll.
                example: true
            comment_text:
                type: string
                description: The comment text
                example: Rerum distinctio voluptatem.
            profile_picture:
                type: string
                description: URL of the voter's profile picture. Absent entirely when the poll has pseudo_anonymity enabled.
                example: Et nihil fuga quisquam quis fugiat voluptas.
            user_id:
                type: string
                description: The LFX identifier of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
                example: Aut vel et error.
            user_name:
                type: string
                description: The name of the voter who submitted this comment. Absent entirely when the poll has pseudo_anonymity enabled.
                example: Laudantium quae nulla.
            vote_creation_time:
                type: string
                description: The time the voter submitted this comment (their vote_creation_time). Absent for comments on an ended pseudo-anonymous poll.
                example: "1986-11-17T19:05:05Z"
                format: date-time
            vote_id:
                type: string
                description: The vote that submitted this comment. Absent for comments on an ended pseudo-anonymous poll, which carry the comment text only.
                example: ac5abba4-4576-4b20-a71b-cd45de2fd981
                format: uuid
        description: A voter's free-text comment response, with attribution
        example:
            abstained: true
            comment_text: Rerum distinctio voluptatem.
            profile_picture: Et nihil fuga quisquam quis fugiat voluptas.
            user_id: Aut vel et error.
            user_name: Laudantium quae nulla.
            vote_creation_time: "1986-11-17T19:05:05Z"
            vote_id: ac5abba4-4576-4b20-a71b-cd45de2fd981
        required:
            - comment_text
    CommentResultItem:
        title: CommentResultItem
        type: object
        properties:
            prompt:
                $ref: '#/definitions/PollCommentPrompt'
            responses:
                type: array
                items:
                    $ref: '#/definitions/CommentResponseWithUser'
                description: The comment responses submitted for this prompt
                example:
                    - abstained: true
                      comment_text: Rerum distinctio voluptatem.
                      profile_picture: Et nihil fuga quisquam quis fugiat voluptas.
                      user_id: Aut vel et error.
                      user_name: Laudantium quae nulla.
                      vote_creation_time: "1986-11-17T19:05:05Z"
                      vote_id: ac5abba4-4576-4b20-a71b-cd45de2fd981
                    - abstained: true
                      comment_text: Rerum distinctio voluptatem.
                      profile_picture: Et nihil fuga quisquam quis fugiat voluptas.
                      user_id: Aut vel et error.
                      user_name: Laudantium quae nulla.
                      vote_creation_time: "1986-11-17T19:05:05Z"
                      vote_id: ac5abba4-4576-4b20-a71b-cd45de2fd981
                    - abstained: true
                      comment_text: Rerum distinctio voluptatem.
                      profile_picture: Et nihil fuga quisquam quis fugiat voluptas.
                      user_id: Aut vel et error.
                      user_name: Laudantium quae nulla.
                      vote_creation_time: "1986-11-17T19:05:05Z"
                      vote_id: ac5abba4-4576-4b20-a71b-cd45de2fd981
        description: Results for a single comment prompt, grouped with every response to it. Every comment prompt on the poll is included, even one with zero responses.
        example:
            prompt:
                prompt: Please provide any additional feedback
                prompt_id: 955b7248-1ca2-4013-8cf7-5d1b612db2ec
            responses:
                - abstained: true
                  comment_text: Rerum distinctio voluptatem.
                  profile_picture: Et nihil fuga quisquam quis fugiat voluptas.
                  user_id: Aut vel et error.
                  user_name: Laudantium quae nulla.
                  vote_creation_time: "1986-11-17T19:05:05Z"
                  vote_id: ac5abba4-4576-4b20-a71b-cd45de2fd981
                - abstained: true
                  comment_text: Rerum distinctio voluptatem.
                  profile_picture: Et nihil fuga quisquam quis fugiat voluptas.
                  user_id: Aut vel et error.
                  user_name: Laudantium quae nulla.
                  vote_creation_time: "1986-11-17T19:05:05Z"
                  vote_id: ac5abba4-4576-4b20-a71b-cd45de2fd981
                - abstained: true
                  comment_text: Rerum distinctio voluptatem.
                  profile_picture: Et nihil fuga quisquam quis fugiat voluptas.
                  user_id: Aut vel et error.
                  user_name: Laudantium quae nulla.
                  vote_creation_time: "1986-11-17T19:05:05Z"
                  vote_id: ac5abba4-4576-4b20-a71b-cd45de2fd981
        required:
            - prompt
            - responses
