    /votes/{uid}/extend:
        post:
            tags:
                - vote
            summary: extend_vote vote
            description: |-
                Extend a vote's end time (proxies to ITX POST /voting/poll/{poll_id}/extend)

                **Required security scopes for jwt**:
                  * `manage:projects`
                  * `manage:voting`
            operationId: vote#extend_vote
            parameters:
                - name: uid
                  in: path
                  description: Vote UID
                  required: true
                  type: string
                  format: uuid
                - name: Authorization
                  in: header
                  description: JWT token
                  required: false
                  type: string
                - name: extend_vote_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/VoteExtendVoteRequestBody'
                    required:
                        - end_time
                        - end_time_timezone
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/VoteResult'
                        required:
                            - uid
                            - name
                            - description
                            - status
                            - project_uid
                            - committee_uid
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/BadRequestError'
                        required:
                            - code
                            - message
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/ForbiddenError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/NotFoundError'
                        required:
                            - code
                            - message
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/InternalServerError'
                        required:
                            - code
                            - message
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/ServiceUnavailableError'
                        required:
                            - code
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /votes/{uid}/results:
        get:
            tags:
                - vote
            summary: get_vote_results vote
            description: |-
                Get vote results (proxies to ITX GET /voting/poll/{poll_id}/results)

                **Required security scopes for jwt**:
                  * `manage:projects`
                  * `manage:voting`
            operationId: vote#get_vote_results
            parameters:
                - name: uid
                  in: path
                  description: Vote UID
                  required: true
                  type: string
                  format: uuid
                - name: Authorization
                  in: header
                  description: JWT token
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/VoteResultsResult'
                        required:
                            - poll_results
                            - num_recipients
                            - num_votes_cast
                            - num_abstained
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/BadRequestError'
                        required:
                            - code
                            - message
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/ForbiddenError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/NotFoundError'
                        required:
