    VoteUpdateVoteRequestBody:
        title: VoteUpdateVoteRequestBody
        type: object
        properties:
            allow_abstain:
                type: boolean
                description: Allow voters to abstain
                default: false
                example: false
            allow_vote_change:
                type: boolean
                description: Allow voters to change a submitted ballot (choices, comments or abstention) until the vote ends. Omitted on create means allowed; omitted on update preserves the stored value.
                example: true
            committee_filters:
                type: array
                items:
                    type: string
                    example: Alternate Voting Rep
                    enum:
                        - Voting Rep
                        - Alternate Voting Rep
                        - Observer
                        - Emeritus
                description: Committee voting status filters
                example:
                    - Voting Rep
                    - Alternate Voting Rep
            committee_uid:
                type: string
                description: LFX Committee UID
                example: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
                format: uuid
            committee_uids:
                type: array
                items:
                    type: string
                    example: Facilis ipsum.
                description: Multiple committee UIDs
                example:
                    - a02bdbaf-53b1-4d47-bc04-dd7e459dd308
                    - b03cdbaf-53b1-4d47-bc04-dd7e459dd309
            description:
                type: string
                description: Vote description
                example: Vote for the TSC members for Q1 2026
            end_time:
                type: string
                description: End time in RFC3339 format
                example: "2026-02-15T23:59:59Z"
                format: date-time
            end_time_timezone:
                type: string
                description: IANA timezone name used to interpret end_time (e.g. "America/New_York"). Required. ITX honors `end_time` exactly as sent in this timezone.
                example: America/New_York
                minLength: 1
            name:
                type: string
                description: Vote name
                example: Q1 2026 Technical Steering Committee Election
                minLength: 1
                maxLength: 200
            num_winners:
                type: integer
                description: Number of winners. Sent upstream only when explicitly provided; meek_stv creates default to 2 when omitted. Updates leave omitted counts for ITX to resolve.
                example: 7
                format: int64
                minimum: 2
                maximum: 10
            poll_comment_prompts:
                type: array
                items:
                    $ref: '#/definitions/PollCommentPromptInput'
                description: Comment prompts for the vote
                example:
                    - prompt: Please provide any additional feedback
                    - prompt: Please provide any additional feedback
                    - prompt: Please provide any additional feedback
            poll_questions:
                type: array
                items:
                    $ref: '#/definitions/PollQuestion'
                description: Questions for the vote
                example:
                    - choices:
                        - choice_id: 59481638-823c-48ea-805a-cc3c71ec0848
                          choice_text: John Doe
                        - choice_id: 59481638-823c-48ea-805a-cc3c71ec0848
                          choice_text: John Doe
                      prompt: Who should be elected to the TSC?
                      question_id: c206dc2f-7638-4cfd-b544-fc4e84f6a402
                      type: single_choice
                    - choices:
                        - choice_id: 59481638-823c-48ea-805a-cc3c71ec0848
                          choice_text: John Doe
                        - choice_id: 59481638-823c-48ea-805a-cc3c71ec0848
                          choice_text: John Doe
                      prompt: Who should be elected to the TSC?
                      question_id: c206dc2f-7638-4cfd-b544-fc4e84f6a402
                      type: single_choice
                    - choices:
                        - choice_id: 59481638-823c-48ea-805a-cc3c71ec0848
                          choice_text: John Doe
                        - choice_id: 59481638-823c-48ea-805a-cc3c71ec0848
                          choice_text: John Doe
                      prompt: Who should be elected to the TSC?
                      question_id: c206dc2f-7638-4cfd-b544-fc4e84f6a402
                      type: single_choice
                    - choices:
                        - choice_id: 59481638-823c-48ea-805a-cc3c71ec0848
                          choice_text: John Doe
                        - choice_id: 59481638-823c-48ea-805a-cc3c71ec0848
                          choice_text: John Doe
                      prompt: Who should be elected to the TSC?
                      question_id: c206dc2f-7638-4cfd-b544-fc4e84f6a402
                      type: single_choice
            poll_type:
                type: string
                description: Type of poll
                example: condorcet_irv
                enum:
                    - generic
                    - condorcet_irv
                    - meek_stv
                    - instant_runoff_vote
            project_uid:
                type: string
                description: LFX Project UID
                example: a09P000000DsCBuIRT
            pseudo_anonymity:
                type: boolean
                description: Enable pseudo-anonymity
                default: false
                example: true
            quorum_percentage:
                type: integer
                description: Quorum percentage required
                example: 50
                format: int64
                minimum: 0
                maximum: 100
            winning_threshold_percentage:
                type: integer
                description: Winning threshold percentage
                example: 51
                format: int64
                minimum: 0
                maximum: 100
        example:
            allow_abstain: false
            allow_vote_change: true
            committee_filters:
                - Voting Rep
                - Alternate Voting Rep
            committee_uid: a02bdbaf-53b1-4d47-bc04-dd7e459dd308
