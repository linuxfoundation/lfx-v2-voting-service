definitions:
    BadRequestError:
        title: BadRequestError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Minus qui dignissimos.
            message:
                type: string
                description: Error message
                example: Dolor maxime nostrum ut et.
        description: Bad request
        example:
            code: Saepe eaque magni assumenda doloremque dignissimos.
            message: Perspiciatis harum voluptatem totam sit.
        required:
            - code
            - message
    CommentResultItem:
        title: CommentResultItem
        type: object
        properties:
            comments:
                type: array
                items:
                    type: string
                    example: Et voluptatem ut voluptas.
                description: List of comments
                example:
                    - Quis dicta odio.
                    - Omnis est debitis laboriosam.
            prompt:
                type: string
                description: Comment prompt
                example: Qui rerum in ipsum perspiciatis qui.
        description: Comment results
        example:
            comments:
                - Ipsa qui.
                - Officiis quidem inventore et harum.
            prompt: Minima ab possimus corporis cum harum quis.
        required:
            - prompt
            - comments
    ConflictError:
        title: ConflictError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Delectus optio aspernatur.
            message:
                type: string
                description: Error message
                example: Adipisci dolores earum est autem quidem amet.
        description: Conflict
        example:
            code: Voluptas atque quam nobis est sequi.
            message: Et ut ut.
        required:
            - code
            - message
    ForbiddenError:
        title: ForbiddenError
        type: object
        properties:
            code:
                type: string
                description: HTTP status code
                example: Et qui officiis et repudiandae corporis eaque.
            message:
