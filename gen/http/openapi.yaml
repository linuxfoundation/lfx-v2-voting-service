                - vote
            summary: end_vote vote
            description: |-
                End an active vote immediately (proxies to ITX POST /voting/poll/{poll_id}/end). Idempotent for an already-ended vote; a disabled vote returns 409. Ending preserves the vote and its results; to cancel and remove an active vote use delete_vote.

                **Required security scopes for jwt**:
                  * `manage:projects`
                  * `manage:voting`
            operationId: vote#end_vote
