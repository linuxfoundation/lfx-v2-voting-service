swagger: "2.0"
info:
    title: LFX V2 - Voting Service
    description: Proxy service for ITX voting system
    version: "1.0"
host: localhost:8080
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /vote_links/ballot:
        post:
            tags:
                - vote
            summary: get_vote_ballot_by_link vote
            description: 'Get the vote''s questions and the link holder''s own ballot using a personalized vote link token, without logging in. The vote and ballot are identified only by the token. External callers send no Authorization header: the gateway (Heimdall) admits the request anonymously and supplies the JWT shown in this spec''s security requirement.'
            operationId: vote#get_vote_ballot_by_link
            parameters:
                - name: Authorization
                  in: header
                  description: JWT token
                  required: false
                  type: string
                - name: get_vote_ballot_by_link_request_body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/VoteGetVoteBallotByLinkRequestBody'
                    required:
                        - vote_token
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/VoteLinkBallotResult'
                        required:
                            - vote_uid
                            - project_uid
                            - name
                            - description
                            - status
                            - pseudo_anonymity
                            - ballot
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/definitions/BadRequestError'
                        required:
                            - code
                            - message
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/definitions/UnauthorizedError'
                        required:
                            - code
                            - message
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/definitions/ForbiddenError'
                        required:
                            - code
                            - message
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/definitions/NotFoundError'
                        required:
                            - code
                            - message
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/definitions/InternalServerError'
                        required:
                            - code
                            - message
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/definitions/ServiceUnavailableError'
                        required:
                            - code
                            - message
            schemes:
                - http
            security:
                - jwt_header_Authorization: []
    /vote_links/responses:
        put:
            tags:
                - vote
            summary: update_vote_response_by_link vote
            description: 'Update a vote response using a personalized vote link token, without logging in (proxies to ITX PUT /voting/vote/{vote_id}). The ballot is identified only by the token. External callers send no Authorization header: the gateway (Heimdall) admits the request anonymously and supplies the JWT shown in this spec''s security requirement. Omitting comment_responses preserves existing comments; including it (even empty) replaces them. Returns 409 when the vote does not allow changing a submitted ballot.'
            operationId: vote#update_vote_response_by_link
            parameters:
                - name: Authorization
                  in: header
