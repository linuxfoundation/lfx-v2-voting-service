swagger: "2.0"
info:
    title: LFX V2 - Voting Service
    description: Proxy service for ITX voting system
    version: "1.0"
host: localhost:8080
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
