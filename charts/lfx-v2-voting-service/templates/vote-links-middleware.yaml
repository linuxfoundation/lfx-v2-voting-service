{{- if .Values.heimdall.enabled }}
---
# Request-body cap for the anonymous /vote_links/ routes. It runs before authentication on
# that route in every mode, so Traefik rejects larger bodies with 413 before Heimdall or the
# service see them. Rendered whenever Heimdall is enabled, independent of
# heimdall.add_middleware, because the route always references it. The service enforces the
# same cap itself (maxVoteLinkBodyBytes in cmd/voting-api/main.go).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vote-links-body-limit
  namespace: {{ .Values.lfx.namespace }}
spec:
  buffering:
    maxRequestBodyBytes: 1048576
{{- end }}
