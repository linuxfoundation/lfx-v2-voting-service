{{ if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.ingress.from }}
{{- fail "networkPolicy.ingress.from must contain at least one ingress peer when networkPolicy.enabled is true" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Chart.Name }}-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Chart.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingress.from | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
