---
# Image configuration
image:
  repository: ghcr.io/linuxfoundation/lfx-v2-voting-service/voting-api
  tag: ""  # Overrides appVersion from Chart.yaml
  pullPolicy: IfNotPresent

replicaCount: 1

# podAnnotations are additional annotations applied to the pod template.
# Example:
#   prometheus.io/scrape: "true"
#   prometheus.io/port: "8080"
podAnnotations: {}

# podLabels are additional labels applied to the pod template.
# Example:
#   team: platform
#   environment: production
podLabels: {}

# podDisruptionBudget configures a PodDisruptionBudget for the deployment.
# Only one of minAvailable or maxUnavailable may be set (not both).
podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Application configuration
app:
  audience: lfx-v2-voting-service
  use_oidc_contextualizer: true

  environment:
    # Server configuration
    PORT:
      value: "8080"
    LOG_LEVEL:
      value: info
    LOG_ADD_SOURCE:
      value: "true"

    # JWT authentication (Heimdall)
    JWKS_URL:
      value: http://lfx-platform-heimdall.lfx.svc.cluster.local:4457/.well-known/jwks
    AUDIENCE:
      value: lfx-v2-voting-service
    JWT_AUTH_DISABLED_MOCK_LOCAL_PRINCIPAL:
      value: ''

    # ITX service configuration
    ITX_BASE_URL:
      value: https://api.dev.itx.linuxfoundation.org/
    ITX_AUTH0_DOMAIN:
      value: linuxfoundation.auth0.com
    ITX_CLIENT_ID:
      valueFrom:
        secretKeyRef:
          name: lfx-v2-voting-service
          key: ITX_CLIENT_ID
    ITX_CLIENT_PRIVATE_KEY:
      valueFrom:
        secretKeyRef:
          name: lfx-v2-voting-service
          key: ITX_CLIENT_PRIVATE_KEY
    ITX_AUDIENCE:
      value: https://api.dev.itx.linuxfoundation.org/

    # NATS configuration
    NATS_URL:
      value: nats://lfx-platform-nats.lfx.svc.cluster.local:4222
    ID_MAPPING_DISABLED:
      value: false

    # LFX_ENVIRONMENT is optional (dev, staging, prod) - defaults to prod if not set
    LFX_ENVIRONMENT:
      value: dev
    # INVITES_ENABLED gates outbound LFID invite requests for no-LFID vote responses
    # and the invite_accepted enrichment subscriber.
    INVITES_ENABLED:
      value: false
    # LFX_SELF_SERVE_BASE_URL overrides the base URL embedded in invite emails.
    # Defaults to the environment-appropriate app URL derived from LFX_ENVIRONMENT.
    LFX_SELF_SERVE_BASE_URL:
      value: ""

    # OpenTelemetry configuration
    OTEL_SERVICE_NAME:
      value: lfx-v2-voting-service
# yamllint disable rule:comments-indentation
    # OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_PROTOCOL, and sampler
    # settings are set via ArgoCD production overrides.
# yamllint enable rule:comments-indentation

# Traefik Gateway API routing
traefik:
  gateway:
    name: lfx-platform-gateway
    namespace: lfx

# global is the configuration for the global settings
global:
  # awsRegion is the AWS region for the External Secrets Operator
  awsRegion: us-west-2

# lfx is the configuration for LFX platform
lfx:
  # domain is the base domain for routing
  domain: k8s.orb.local
  # namespace is the target namespace for deployment
  namespace: lfx

# service is the configuration for the Kubernetes service
service:
  # port is the service port
  port: 8080

# serviceAccount is the configuration for the Kubernetes service account
serviceAccount:
  # create specifies whether a service account should be created
  create: true
  # name is the name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "lfx-v2-voting-service"
  # annotations to add to the service account
  annotations: {}
  # automountServiceAccountToken is a boolean to determine if the service account token should be automatically mounted
  automountServiceAccountToken: true

# openfga is the configuration for the OpenFGA server
openfga:
  # enabled is a boolean to determine if the OpenFGA server should be enabled for authorization
  # Note: If it is disabled, then the meeting service will allow all requests
  # (Disabling OpenFGA should only be used for local development).
  enabled: true

# heimdall is the configuration for the heimdall middleware
heimdall:
  enabled: true
  url: http://lfx-platform-heimdall.lfx.svc.cluster.local:4456
  add_middleware: false

# External Secrets Operator
externalSecretsOperator:
  # Enable/disable External Secrets Operator integration
  enabled: false

  # ExternalSecret configuration
  externalSecret:
    # How often to refresh secrets from AWS
    refreshInterval: "10m"

    # Secret data mappings
    # REQUIRED: Secrets must exist in AWS Secrets Manager (global.awsRegion)
    # NOTE: client_private_key should be stored as raw PEM format (not base64-encoded)
    data:
      - secretKey: ITX_CLIENT_ID
        remoteRef:
          key: /cloudops/managed-secrets/auth0/LFX_V2_Voting_Service
          property: client_id
      - secretKey: ITX_CLIENT_PRIVATE_KEY
        remoteRef:
          key: /cloudops/managed-secrets/auth0/LFX_V2_Voting_Service
          property: client_private_key
